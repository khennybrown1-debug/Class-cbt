    {"id": "PHC-104", "topic": "Tiers of the Nigerian Health System", "q": "Formulating national health policy and coordinating health activities across Nigeria is mainly the role of the", "options": ["Ward Development Committee", "Local Government Health Department", "Federal Ministry of Health", "Village Development Committee"], "answer": 2, "explain": "The Federal Ministry of Health sets national policy and standards."},
    {"id": "PHC-105", "topic": "Tiers of the Nigerian Health System", "q": "Federal Medical Centres were established mainly to", "options": ["provide tertiary care in states without federal teaching hospitals", "replace all primary health centres", "train traditional birth attendants only", "serve only the military"], "answer": 0, "explain": "FMCs extend federal tertiary services to more states."},
    {"id": "PHC-106", "topic": "Tiers of the Nigerian Health System", "q": "A frontline worker at the primary level who is trained in schools of health technology and treats common illnesses using standing orders is the", "options": ["consultant surgeon", "Community Health Extension Worker (CHEW)", "pharmacist in a teaching hospital", "medical laboratory scientist in a tertiary centre"], "answer": 1, "explain": "CHEWs are key PHC workers in Nigeria."},
    {"id": "PHC-107", "topic": "Tiers of the Nigerian Health System", "q": "\"Standing orders\" used by PHC workers are", "options": ["approved guidelines that tell them how to diagnose and treat common conditions", "military commands", "hospital visiting hours", "rules for building health centres"], "answer": 0, "explain": "Standing orders allow CHEWs to manage common conditions safely."},
    {"id": "PHC-108", "topic": "Tiers of the Nigerian Health System", "q": "Specialised hospitals such as national orthopaedic hospitals and federal neuropsychiatric hospitals belong to the", "options": ["primary level", "ward level", "village level", "tertiary level"], "answer": 3, "explain": "They provide highly specialised services."},
    {"id": "PHC-109", "topic": "Tiers of the Nigerian Health System", "q": "Secondary health care typically provides", "options": ["only health education", "only immunisation", "in-patient care, general surgery, laboratory and radiological services", "highly specialised heart transplants"], "answer": 2, "explain": "Secondary care is more complex than primary but less specialised than tertiary."},
    {"id": "PHC-110", "topic": "Tiers of the Nigerian Health System", "q": "Under the Ward Health System, the minimum standard is", "options": ["one teaching hospital in every ward", "no health facility in rural wards", "at least one functional primary health care centre in every political ward", "one general hospital in every village"], "answer": 2, "explain": "The ward is the operational unit of PHC."},
    {"id": "PHC-111", "topic": "Tiers of the Nigerian Health System", "q": "Which tier is usually expected to handle the largest number of patients if the system works properly?", "options": ["Tertiary", "Primary", "Secondary", "Quaternary"], "answer": 1, "explain": "Most health problems can be solved at the primary level."},
    {"id": "PHC-112", "topic": "Tiers of the Nigerian Health System", "q": "When patients bypass primary health centres and go directly to teaching hospitals for minor illnesses, the result is", "options": ["overcrowding of tertiary facilities", "better use of resources", "reduced waiting time", "stronger PHC"], "answer": 0, "explain": "Bypassing the referral system overloads higher levels."},
    {"id": "PHC-113", "topic": "Tiers of the Nigerian Health System", "q": "Supervision of LGA primary health care activities and the training of nurses and midwives in schools of nursing are typically roles of the", "options": ["State Ministry of Health", "Village Development Committee", "Ward Health Committee", "National Assembly"], "answer": 0, "explain": "States supervise PHC in LGAs and run nursing schools."},
    {"id": "PHC-114", "topic": "Tiers of the Nigerian Health System", "q": "A comprehensive health centre in Nigeria is", "options": ["a tertiary teaching hospital", "a private specialist clinic only", "a pharmacy warehouse", "a primary level facility that offers a wider range of services than a basic PHC centre"], "answer": 3, "explain": "Comprehensive health centres are the highest type of PHC facility."},
    {"id": "PHC-115", "topic": "Definition, Features and Objectives of PHC", "q": "Primary Health Care is defined by the Alma-Ata Declaration as", "options": ["specialist care provided only in teaching hospitals", "expensive care available to the rich", "essential health care made universally accessible to individuals and families through their full participation, at a cost they can afford", "the treatment of rare diseases"], "answer": 2, "explain": "This summarises the Alma-Ata definition."},
    {"id": "PHC-116", "topic": "Definition, Features and Objectives of PHC", "q": "Primary Health Care places greater emphasis on", "options": ["expensive curative surgery", "promotive and preventive services", "organ transplantation", "research only"], "answer": 1, "explain": "PHC focuses on preventing disease and promoting health."},
    {"id": "PHC-117", "topic": "Definition, Features and Objectives of PHC", "q": "Which of the following is a key feature of PHC?", "options": ["Concentration of services in cities", "Use of complex imported technology", "Services for the rich only", "Community participation"], "answer": 3, "explain": "PHC is planned and run with active community involvement."},
    {"id": "PHC-118", "topic": "Definition, Features and Objectives of PHC", "q": "The overall aim of PHC is to", "options": ["achieve health for all by providing essential health care to everyone", "build more teaching hospitals", "train only specialists", "replace all hospitals"], "answer": 0, "explain": "PHC is the main strategy for Health for All."},
    {"id": "PHC-119", "topic": "Definition, Features and Objectives of PHC", "q": "An objective of PHC is to reduce morbidity and mortality, especially among", "options": ["wealthy urban dwellers", "university lecturers", "specialist doctors", "mothers and children"], "answer": 3, "explain": "Mothers and children are the most vulnerable groups."},
    {"id": "PHC-120", "topic": "Definition, Features and Objectives of PHC", "q": "Primary health care differs from \"primary medical care\" mainly because PHC", "options": ["includes community participation, prevention and action in other sectors such as water and education", "deals only with doctors' consultations", "is limited to drug treatment", "is only for hospitals"], "answer": 0, "explain": "PHC is broader than first-contact medical treatment."},
    {"id": "PHC-121", "topic": "Definition, Features and Objectives of PHC", "q": "Which of the following is an example of a promotive (health promotion) activity in PHC?", "options": ["Setting a broken leg", "Performing a caesarean section", "Teaching a community about healthy diets and regular exercise", "Giving a blood transfusion"], "answer": 2, "explain": "Promotive activities help people stay healthy."},
    {"id": "PHC-122", "topic": "Definition, Features and Objectives of PHC", "q": "An integrated PHC service means that", "options": ["each disease has a separate clinic in a different town", "only one service is provided at a time", "several services such as immunisation, antenatal care and treatment are offered together at one point", "services are offered only by private clinics"], "answer": 2, "explain": "Integration avoids fragmented vertical services."},
    {"id": "PHC-123", "topic": "Definition, Features and Objectives of PHC", "q": "PHC is said to be \"comprehensive\" because it", "options": ["provides only curative services", "covers only immunisation", "provides promotive, preventive, curative and rehabilitative services", "serves only children"], "answer": 2, "explain": "Comprehensive PHC covers the full range of basic services."},
    {"id": "PHC-124", "topic": "Definition, Features and Objectives of PHC", "q": "One objective of PHC is to promote self-reliance, meaning that communities should", "options": ["depend completely on government for everything", "depend completely on foreign donors", "avoid health services", "take responsibility for their own health using their own resources and initiative"], "answer": 3, "explain": "Self-reliance encourages communities to solve their own health problems."},
    {"id": "PHC-125", "topic": "Definition, Features and Objectives of PHC", "q": "A feature of PHC is continuity of care, which means", "options": ["care stops after one visit", "people receive ongoing care over time, including follow-up", "each visit is to a different health system", "only emergencies are handled"], "answer": 1, "explain": "Continuity ensures follow-up and long-term care."},
    {"id": "PHC-126", "topic": "Definition, Features and Objectives of PHC", "q": "PHC services are targeted mainly at", "options": ["the whole community, with special attention to underserved and vulnerable groups", "only those who can pay", "only government workers", "only hospital in-patients"], "answer": 0, "explain": "PHC aims at universal coverage."},
    {"id": "PHC-127", "topic": "Definition, Features and Objectives of PHC", "q": "PHC is described as \"socially acceptable\" when its services", "options": ["are imported without adaptation", "are rejected by the community", "are in harmony with the culture and values of the community", "ignore local customs"], "answer": 2, "explain": "Acceptability encourages people to use services."},
    {"id": "PHC-128", "topic": "Definition, Features and Objectives of PHC", "q": "An objective of PHC is to provide basic health services that are", "options": ["expensive and exclusive", "available, accessible, affordable and acceptable", "available only in cities", "delivered only by foreign doctors"], "answer": 1, "explain": "These four A's summarise access goals."},
    {"id": "PHC-129", "topic": "Definition, Features and Objectives of PHC", "q": "The Alma-Ata Declaration says PHC should reflect the economic conditions and socio-cultural characteristics of the country. This means PHC should be", "options": ["identical in every country", "designed only by foreign experts", "adapted to local conditions rather than copied unchanged from other countries", "limited to urban areas"], "answer": 2, "explain": "PHC must fit local realities."},
    {"id": "PHC-130", "topic": "Definition, Features and Objectives of PHC", "q": "Rehabilitative services in PHC aim to", "options": ["prevent birth", "build hospitals", "restore people with disabilities or after illness to the best possible functioning", "train doctors"], "answer": 2, "explain": "Rehabilitation helps people regain function and independence."},
    {"id": "PHC-131", "topic": "Definition, Features and Objectives of PHC", "q": "PHC is described as \"essential\" health care because it", "options": ["includes every specialist service", "covers the basic services needed to solve the main health problems of the community", "is optional", "is meant only for emergencies"], "answer": 1, "explain": "Essential care addresses the most important needs first."},
    {"id": "PHC-132", "topic": "Definition, Features and Objectives of PHC", "q": "PHC is said to be \"people-centred\" because", "options": ["it ignores community opinion", "it is run only by doctors", "it serves only individuals who are admitted", "it is organised around the needs and participation of people rather than diseases or institutions"], "answer": 3, "explain": "People-centred care puts the community at the centre of planning and delivery."},
    {"id": "PHC-133", "topic": "Definition, Features and Objectives of PHC", "q": "Health education is a key feature of PHC because it", "options": ["helps people adopt healthy behaviours and use services wisely", "replaces the need for clean water", "is only for health workers", "is used only in teaching hospitals"], "answer": 0, "explain": "Health education empowers people to protect their own health."},
    {"id": "PHC-134", "topic": "Definition, Features and Objectives of PHC", "q": "An objective of PHC that relates to the distribution of health services is to", "options": ["increase urban hospitals only", "benefit only the wealthy", "concentrate doctors in cities", "reduce inequalities in health between rich and poor, and urban and rural areas"], "answer": 3, "explain": "PHC seeks to close health gaps."},
    {"id": "PHC-135", "topic": "Definition, Features and Objectives of PHC", "q": "PHC is considered cost-effective mainly because", "options": ["it uses only expensive equipment", "it requires every patient to see a specialist", "it ignores prevention", "preventing disease early is cheaper than treating advanced illness in hospitals"], "answer": 3, "explain": "Prevention and early treatment save money."},
    {"id": "PHC-136", "topic": "Principles of PHC", "q": "The principle of equity in PHC means", "options": ["everyone must receive exactly the same drugs", "only the rich should get services", "services should be concentrated in cities", "health services should be distributed according to need, giving priority to the underserved"], "answer": 3, "explain": "Equity is fairness based on need."},
    {"id": "PHC-137", "topic": "Principles of PHC", "q": "Community participation in PHC means", "options": ["community members are involved in planning, implementing and evaluating health services", "the community only receives services passively", "only doctors make decisions", "communities pay for everything without a say"], "answer": 0, "explain": "Participation gives people ownership of their health services."},
    {"id": "PHC-138", "topic": "Principles of PHC", "q": "Intersectoral collaboration in PHC means", "options": ["doctors work only with nurses", "health workers work alone", "hospitals compete with one another", "the health sector works with other sectors such as agriculture, education and water resources"], "answer": 3, "explain": "Many determinants of health lie outside the health sector."},
    {"id": "PHC-139", "topic": "Principles of PHC", "q": "Appropriate technology in PHC refers to methods and equipment that are", "options": ["the most expensive available", "imported from abroad only", "scientifically sound, adapted to local needs, acceptable and affordable", "too complex for local staff to use"], "answer": 2, "explain": "Appropriate technology can be maintained by the community."},
    {"id": "PHC-140", "topic": "Principles of PHC", "q": "A village that digs a well with labour from the community and technical support from the Ministry of Water Resources is applying the PHC principle of", "options": ["appropriate technology only", "decentralisation", "equity only", "intersectoral collaboration"], "answer": 3, "explain": "Health improvement here involves the water sector working with the community."},
    {"id": "PHC-141", "topic": "Principles of PHC", "q": "Building a new health centre in a rural area that has long been neglected, rather than in a city that already has many hospitals, reflects the principle of", "options": ["equity", "intersectoral collaboration", "appropriate technology", "referral"], "answer": 0, "explain": "Resources are directed to those with greater need."},
    {"id": "PHC-142", "topic": "Principles of PHC", "q": "Community members serving on a committee that decides the priorities of their health centre is an example of", "options": ["intersectoral collaboration", "appropriate technology", "community participation", "referral"], "answer": 2, "explain": "The community is involved in decision making."},
    {"id": "PHC-143", "topic": "Principles of PHC", "q": "Teaching mothers to prepare oral rehydration solution at home with clean water, salt and sugar is an example of", "options": ["sophisticated technology", "tertiary care", "referral", "appropriate technology"], "answer": 3, "explain": "It is simple, cheap, effective and acceptable."},
    {"id": "PHC-144", "topic": "Principles of PHC", "q": "The principle that health services should be within reasonable reach of the people, for example within walking distance, is", "options": ["equity", "geographical accessibility", "intersectoral collaboration", "self-reliance"], "answer": 1, "explain": "Accessibility includes physical distance to services."},
    {"id": "PHC-145", "topic": "Principles of PHC", "q": "The principle that the cost of services should be within what the community and country can pay is", "options": ["acceptability", "integration", "decentralisation", "affordability"], "answer": 3, "explain": "Services that are too expensive will not be used."},
    {"id": "PHC-146", "topic": "Principles of PHC", "q": "The principle that health services should agree with the beliefs and culture of the people is", "options": ["affordability", "decentralisation", "acceptability", "integration"], "answer": 2, "explain": "Culturally unacceptable services will be avoided."},
    {"id": "PHC-147", "topic": "Principles of PHC", "q": "Decentralisation in PHC means", "options": ["concentrating all decisions in Abuja", "closing rural health facilities", "transferring all care to teaching hospitals", "delegating authority and resources to lower levels such as LGAs and wards"], "answer": 3, "explain": "Decentralisation brings decision making closer to communities."},
    {"id": "PHC-148", "topic": "Principles of PHC", "q": "Emphasising immunisation and health education rather than expensive hospital treatment reflects the PHC principle of", "options": ["specialisation", "focus on prevention", "centralisation", "privatisation"], "answer": 1, "explain": "Prevention is a core principle of PHC."},
    {"id": "PHC-149", "topic": "Principles of PHC", "q": "PHC uses a team approach, which means that", "options": ["one doctor does all the work", "different categories of health workers work together to deliver care", "only volunteers provide services", "patients treat themselves"], "answer": 1, "explain": "A multidisciplinary team is needed to deliver the range of PHC services."},
    {"id": "PHC-150", "topic": "Principles of PHC", "q": "Training community health workers who are suited to local needs is part of the principle of", "options": ["centralisation", "privatisation", "equity of income", "manpower (human resource) development"], "answer": 3, "explain": "PHC needs appropriately trained health workers."},
    {"id": "PHC-151", "topic": "Principles of PHC", "q": "Which of the following is NOT a principle of PHC?", "options": ["Use of sophisticated and expensive technology", "Equity", "Community participation", "Intersectoral collaboration"], "answer": 0, "explain": "PHC promotes appropriate, not sophisticated, technology."},
    {"id": "PHC-152", "topic": "Principles of PHC", "q": "The PHC principle which ensures that health programmes continue after external funding ends is", "options": ["equity", "sustainability", "referral", "accessibility"], "answer": 1, "explain": "Sustainable programmes are planned to be maintained with local resources."},
    {"id": "PHC-153", "topic": "Principles of PHC", "q": "Opening a health centre during market days and evenings so that farmers and traders can use it improves", "options": ["equity of income", "functional accessibility", "intersectoral collaboration", "specialisation"], "answer": 1, "explain": "Services must be available at times people can use them."},
    {"id": "PHC-154", "topic": "Principles of PHC", "q": "When PHC planning is done by health workers together with the community rather than imposed from above, it follows the", "options": ["bottom-up approach", "top-down approach", "vertical approach", "military approach"], "answer": 0, "explain": "PHC favours bottom-up planning."},
    {"id": "PHC-155", "topic": "Components of PHC", "q": "How many essential components (elements) of PHC were listed in the Alma-Ata Declaration?", "options": ["Five", "Twelve", "Three", "Eight"], "answer": 3, "explain": "The original Alma-Ata list has eight elements."},
    {"id": "PHC-156", "topic": "Components of PHC", "q": "Which of the following is one of the original eight components of PHC?", "options": ["Provision of essential drugs", "Heart transplantation", "Cosmetic surgery", "Space medicine"], "answer": 0, "explain": "Provision of essential drugs is one of the eight elements."},
    {"id": "PHC-157", "topic": "Components of PHC", "q": "Which of the following was NOT among the original eight components of PHC listed at Alma-Ata?", "options": ["Immunisation against major infectious diseases", "Maternal and child health including family planning", "Provision of essential drugs", "Mental health"], "answer": 3, "explain": "Mental health was added later by countries such as Nigeria."},
    {"id": "PHC-158", "topic": "Components of PHC", "q": "Which of the following is among the components added in Nigeria to the original Alma-Ata elements of PHC?", "options": ["Open-heart surgery", "Organ transplantation", "Oral (dental) health", "Plastic surgery"], "answer": 2, "explain": "Nigeria added components such as mental health and oral health."},
    {"id": "PHC-159", "topic": "Components of PHC", "q": "In the mnemonic \"ELEMENTS\" used to remember the components of PHC, the letter N stands for", "options": ["nursing care", "promotion of food supply and proper nutrition", "national health insurance", "non-communicable diseases"], "answer": 1, "explain": "The mnemonic covers Education, Locally endemic diseases, EPI, MCH, Essential drugs, Nutrition, Treatment and Safe water."},
    {"id": "PHC-160", "topic": "Components of PHC", "q": "Health education as a component of PHC is mainly aimed at", "options": ["improving people's knowledge, attitudes and practices about prevailing health problems", "teaching medical students surgery", "advertising drugs", "training engineers"], "answer": 0, "explain": "Health education is listed first among the Alma-Ata elements."},
    {"id": "PHC-161", "topic": "Components of PHC", "q": "Family planning services are provided under which component of PHC?", "options": ["Treatment of common diseases", "Maternal and child health care", "Provision of essential drugs", "Control of endemic diseases"], "answer": 1, "explain": "Alma-Ata lists maternal and child health care, including family planning."},
    {"id": "PHC-162", "topic": "Components of PHC", "q": "Which of the following was one of the six childhood diseases originally targeted by the Expanded Programme on Immunisation?", "options": ["Measles", "Malaria", "HIV/AIDS", "Cholera"], "answer": 0, "explain": "The six were tuberculosis, diphtheria, pertussis, tetanus, poliomyelitis and measles."},
    {"id": "PHC-163", "topic": "Components of PHC", "q": "The BCG vaccine given at birth protects mainly against", "options": ["measles", "polio", "yellow fever", "tuberculosis"], "answer": 3, "explain": "BCG (Bacille Calmette-Guerin) protects against severe forms of tuberculosis."},
    {"id": "PHC-164", "topic": "Components of PHC", "q": "In Nigeria's routine immunisation schedule, the first dose of measles vaccine is given at", "options": ["birth", "6 weeks", "9 months", "5 years"], "answer": 2, "explain": "Measles vaccine is given at 9 months of age."},
    {"id": "PHC-165", "topic": "Components of PHC", "q": "Malaria, onchocerciasis and Lassa fever control programmes in Nigeria fall under which PHC component?", "options": ["Provision of essential drugs", "Family planning", "Prevention and control of locally endemic diseases", "Oral health"], "answer": 2, "explain": "These are diseases common in particular localities."},
    {"id": "PHC-166", "topic": "Components of PHC", "q": "Provision of safe water supply and basic sanitation helps to prevent", "options": ["diarrhoeal diseases such as cholera, and guinea worm infection", "sickle cell disease", "diabetes", "hypertension"], "answer": 0, "explain": "Many diseases are transmitted through contaminated water and poor sanitation."},
    {"id": "PHC-167", "topic": "Components of PHC", "q": "Essential drugs are defined by WHO as drugs that", "options": ["are the most expensive available", "are available only in teaching hospitals", "satisfy the priority health care needs of the population", "are used only for surgery"], "answer": 2, "explain": "Essential medicines should be available at all times in adequate amounts and at affordable prices."},
    {"id": "PHC-168", "topic": "Components of PHC", "q": "WHO published its first Model List of Essential Drugs in", "options": ["1948", "1999", "1977", "2014"], "answer": 2, "explain": "The first essential drugs list appeared in 1977, a year before Alma-Ata."},
    {"id": "PHC-169", "topic": "Components of PHC", "q": "WHO and UNICEF recommend exclusive breastfeeding for the first", "options": ["2 weeks of life", "6 months of life", "2 years of life", "12 months of life"], "answer": 1, "explain": "Exclusive breastfeeding is recommended for the first six months."},
    {"id": "PHC-170", "topic": "Components of PHC", "q": "Which of the following is an example of the PHC component \"provision of essential drugs\"?", "options": ["Building a teaching hospital", "Keeping a health post stocked with basic medicines such as ORS, antimalarials and paracetamol", "Importing MRI machines", "Training heart surgeons"], "answer": 1, "explain": "Essential drugs must be available where people receive care."},
    {"id": "PHC-171", "topic": "Components of PHC", "q": "Tetanus-diphtheria (Td) vaccination of pregnant women is given mainly to prevent", "options": ["maternal and neonatal tetanus", "malaria in pregnancy", "anaemia", "sickle cell disease"], "answer": 0, "explain": "Antibodies pass to the baby and protect against tetanus of the newborn."},
    {"id": "PHC-172", "topic": "Components of PHC", "q": "Proper disposal of refuse and human waste falls under which PHC component?", "options": ["Basic sanitation", "Essential drugs", "Health education only", "Immunisation"], "answer": 0, "explain": "Sanitation controls the spread of disease from wastes."},
    {"id": "PHC-173", "topic": "Components of PHC", "q": "Treating a child with a simple cut or a mild malaria episode at a primary health centre falls under which component of PHC?", "options": ["Family planning", "Oral health", "Appropriate treatment of common diseases and injuries", "Food supply"], "answer": 2, "explain": "Common illnesses and injuries should be treated at primary level."},
    {"id": "PHC-174", "topic": "Components of PHC", "q": "Growth monitoring with weight charts and vitamin A supplementation for children fall mainly under", "options": ["nutrition services", "essential drugs", "water supply", "dental health"], "answer": 0, "explain": "These are nutrition interventions in PHC."},
    {"id": "PHC-175", "topic": "Components of PHC", "q": "The pentavalent vaccine used in Nigeria's routine immunisation protects against diphtheria, pertussis, tetanus, hepatitis B and", "options": ["measles", "yellow fever", "tuberculosis", "Haemophilus influenzae type b"], "answer": 3, "explain": "Pentavalent vaccine combines DPT, hepatitis B and Hib."},
    {"id": "PHC-176", "topic": "Components of PHC", "q": "Mental health as a PHC component focuses on", "options": ["prevention, early detection and community care of mental disorders", "surgery for brain tumours only", "building psychiatric hospitals in every ward only", "dental care"], "answer": 0, "explain": "Mental health services are integrated into PHC."},
    {"id": "PHC-177", "topic": "Components of PHC", "q": "Vitamin A supplementation for children under five helps to", "options": ["treat malaria", "prevent night blindness and reduce child deaths", "cure tuberculosis", "prevent tooth decay"], "answer": 1, "explain": "Vitamin A deficiency causes eye problems and weakens immunity."},
    {"id": "PHC-178", "topic": "Strategies for Implementation of PHC", "q": "When government leaders show support for PHC through policies and adequate budgets, this strategy is called", "options": ["political commitment", "community diagnosis", "counter-referral", "selective PHC"], "answer": 0, "explain": "Political will is essential for PHC success."},
    {"id": "PHC-179", "topic": "Strategies for Implementation of PHC", "q": "The Bamako Initiative of 1987 aimed mainly to", "options": ["build teaching hospitals in Africa", "abolish PHC", "revitalise PHC through community financing and availability of essential drugs", "train specialist surgeons"], "answer": 2, "explain": "It was adopted by African health ministers in Bamako, Mali."},
    {"id": "PHC-180", "topic": "Strategies for Implementation of PHC", "q": "A drug revolving fund is a system in which", "options": ["drugs are given free forever by donors", "drugs are sold for profit by individuals", "drugs are stored but never sold", "money from the sale of drugs is used to buy new stock so drugs remain available"], "answer": 3, "explain": "Revolving funds keep essential drugs in stock."},
    {"id": "PHC-181", "topic": "Strategies for Implementation of PHC", "q": "Community financing of PHC means", "options": ["community members contribute money or resources to support local health services", "the community refuses to pay for anything", "only foreign donors pay", "doctors pay for patients' drugs"], "answer": 0, "explain": "Community financing promotes sustainability and ownership."},
    {"id": "PHC-182", "topic": "Strategies for Implementation of PHC", "q": "The Ward Health System strategy makes which unit the focus of PHC delivery?", "options": ["The state capital", "The federal capital", "The teaching hospital", "The political ward"], "answer": 3, "explain": "Each ward is to have functional PHC services and a Ward Development Committee."},
    {"id": "PHC-183", "topic": "Strategies for Implementation of PHC", "q": "The PHCUOR \"three ones\" principle refers to", "options": ["one doctor, one nurse and one drug", "one management, one plan, and one monitoring and evaluation system", "one village, one hospital and one ambulance", "one state, one LGA and one ward"], "answer": 1, "explain": "This principle reduces fragmentation of PHC."},
    {"id": "PHC-184", "topic": "Strategies for Implementation of PHC", "q": "The National Health Management Information System (NHMIS) supports PHC implementation by", "options": ["treating patients", "building roads", "collecting and analysing health data for planning and decision making", "training traditional rulers"], "answer": 2, "explain": "Accurate data is needed for planning and evaluation."},
    {"id": "PHC-185", "topic": "Strategies for Implementation of PHC", "q": "Training traditional birth attendants (TBAs) in clean and safe delivery practices is a PHC strategy that", "options": ["replaces all midwives", "is forbidden in PHC", "is only for teaching hospitals", "uses existing community resources to improve maternal and newborn care"], "answer": 3, "explain": "TBAs are trusted community members who can be trained and linked to the health system."},
    {"id": "PHC-186", "topic": "Strategies for Implementation of PHC", "q": "Using town criers, drama and radio jingles in local languages to pass health messages is a strategy of", "options": ["referral", "information, education and communication (IEC)", "drug revolving fund", "counter-referral"], "answer": 1, "explain": "IEC spreads health knowledge in ways people understand."},
    {"id": "PHC-187", "topic": "Strategies for Implementation of PHC", "q": "The National Health Act 2014 provides that the Basic Health Care Provision Fund shall receive", "options": ["50% of all oil revenue", "all local government revenue", "not less than 1% of the Consolidated Revenue Fund of the Federation", "nothing from government"], "answer": 2, "explain": "This fund is a key financing strategy for PHC."},
    {"id": "PHC-188", "topic": "Strategies for Implementation of PHC", "q": "Community-based health insurance helps PHC implementation by", "options": ["making care more expensive", "pooling community contributions to reduce out-of-pocket payment at the point of care", "removing all drugs from clinics", "increasing urban hospitals only"], "answer": 1, "explain": "Risk pooling makes services more affordable."},
    {"id": "PHC-189", "topic": "Strategies for Implementation of PHC", "q": "Partnership with development partners such as WHO, UNICEF and NGOs supports PHC mainly by", "options": ["taking over all government responsibilities", "stopping community participation", "providing technical and financial support", "closing health centres"], "answer": 2, "explain": "Partners complement government efforts."},
    {"id": "PHC-190", "topic": "Strategies for Implementation of PHC", "q": "Advocacy as a PHC strategy means", "options": ["treating sick children", "building wells", "counting the population", "persuading leaders and policy makers to support and fund health programmes"], "answer": 3, "explain": "Advocacy targets decision makers."},
    {"id": "PHC-191", "topic": "Strategies for Implementation of PHC", "q": "Regular visits by supervisors to guide and support PHC workers rather than just to find faults is called", "options": ["community diagnosis", "supportive supervision", "referral", "counter-referral"], "answer": 1, "explain": "Supportive supervision improves performance and morale."},
    {"id": "PHC-192", "topic": "Strategies for Implementation of PHC", "q": "The Midwives Service Scheme, launched in Nigeria in 2009, was designed to", "options": ["deploy midwives to rural primary health care facilities", "build teaching hospitals", "train surgeons", "import drugs"], "answer": 0, "explain": "It aimed to reduce maternal and newborn deaths in rural areas."},
    {"id": "PHC-193", "topic": "Strategies for Implementation of PHC", "q": "Mobile clinics and outreach services are PHC strategies used mainly to", "options": ["replace all fixed health centres", "reach people in hard-to-reach or underserved areas", "serve only urban elites", "train doctors"], "answer": 1, "explain": "Outreach takes services to people who cannot easily reach facilities."},
    {"id": "PHC-194", "topic": "Strategies for Implementation of PHC", "q": "Monitoring and evaluation in PHC implementation is done mainly to", "options": ["punish health workers", "check progress and determine whether objectives are being achieved", "stop programmes", "increase costs"], "answer": 1, "explain": "M and E guides improvements."},
    {"id": "PHC-195", "topic": "Strategies for Implementation of PHC", "q": "Village health workers in PHC are usually", "options": ["foreign specialists", "university professors", "appointed only by the President", "selected by their own community and given basic training"], "answer": 3, "explain": "Being from the community makes them trusted and available."},
    {"id": "PHC-196", "topic": "Strategies for Implementation of PHC", "q": "Involving churches, mosques and traditional rulers to mobilise people for immunisation campaigns is a strategy of", "options": ["counter-referral", "drug procurement", "specialist training", "community mobilisation"], "answer": 3, "explain": "Respected leaders help to increase participation."},
    {"id": "PHC-197", "topic": "Strategies for Implementation of PHC", "q": "Integrating vertical programmes, such as separate malaria and immunisation projects, into routine PHC services is a strategy that", "options": ["increases fragmentation", "reduces duplication and improves efficiency", "wastes resources", "reduces coverage"], "answer": 1, "explain": "Integration avoids parallel systems."},
    {"id": "PHC-198", "topic": "Strategies for Implementation of PHC", "q": "Continuous training and retraining of PHC staff is important mainly because it", "options": ["increases the number of hospitals", "reduces the need for supervision completely", "removes the need for drugs", "keeps their knowledge and skills up to date"], "answer": 3, "explain": "Training builds capacity for effective service delivery."},
    {"id": "PHC-199", "topic": "Strategies for Implementation of PHC", "q": "Task shifting as a PHC strategy means", "options": ["shifting all patients to teaching hospitals", "assigning some tasks from highly trained health workers to less specialised but trained workers such as CHEWs", "moving health workers abroad", "stopping some services completely"], "answer": 1, "explain": "Task shifting expands access where doctors are few."},
    {"id": "PHC-200", "topic": "Strategies for Implementation of PHC", "q": "Community-directed treatment with ivermectin (CDTI) for onchocerciasis, in which communities choose and supervise their own distributors, is an example of", "options": ["counter-referral", "tertiary care", "private insurance", "community-directed intervention"], "answer": 3, "explain": "Communities take charge of delivering the treatment."},
    {"id": "PHC-201", "topic": "Selective Primary Health Care", "q": "Selective Primary Health Care was proposed in 1979 by", "options": ["Julia Walsh and Kenneth Warren", "Halfdan Mahler and James Grant", "Dahlgren and Whitehead", "Shannon and Weaver"], "answer": 0, "explain": "Walsh and Warren described it as an interim strategy for disease control in developing countries."},
    {"id": "PHC-202", "topic": "Selective Primary Health Care", "q": "Selective PHC focuses on", "options": ["a few cost-effective interventions against diseases causing the highest mortality", "all the components of PHC at once", "building hospitals", "only curative surgery"], "answer": 0, "explain": "It selects priority diseases and interventions."},
    {"id": "PHC-203", "topic": "Selective Primary Health Care", "q": "The type of PHC described in the Alma-Ata Declaration, covering all elements together with community participation and intersectoral action, is", "options": ["comprehensive PHC", "selective PHC", "tertiary care", "private care"], "answer": 0, "explain": "Alma-Ata promoted comprehensive PHC."},
    {"id": "PHC-204", "topic": "Selective Primary Health Care", "q": "Walsh and Warren described selective PHC as", "options": ["an interim strategy", "a permanent replacement for all health care", "a hospital-based programme", "a strategy only for rich countries"], "answer": 0, "explain": "It was meant as a temporary approach until comprehensive PHC became possible."},
    {"id": "PHC-205", "topic": "Selective Primary Health Care", "q": "The GOBI strategy was promoted mainly by", "options": ["the World Bank", "NAFDAC", "the Red Cross", "UNICEF"], "answer": 3, "explain": "UNICEF under James Grant promoted GOBI in the early 1980s."},
    {"id": "PHC-206", "topic": "Selective Primary Health Care", "q": "In the acronym GOBI, the letter G stands for", "options": ["general surgery", "growth monitoring", "good hygiene", "government funding"], "answer": 1, "explain": "Growth monitoring detects malnutrition early."},
    {"id": "PHC-207", "topic": "Selective Primary Health Care", "q": "In the acronym GOBI, the letter O stands for", "options": ["oral health", "obstetric care", "outpatient services", "oral rehydration therapy"], "answer": 3, "explain": "ORT treats dehydration from diarrhoea."},
    {"id": "PHC-208", "topic": "Selective Primary Health Care", "q": "Under selective PHC, priority was given mainly to diseases that cause high mortality among", "options": ["elderly men only", "professional athletes", "infants and young children", "university students"], "answer": 2, "explain": "Child survival was the main focus."},
    {"id": "PHC-209", "topic": "Selective Primary Health Care", "q": "Integrated Management of Childhood Illness (IMCI), developed by WHO and UNICEF in the 1990s, partly addressed a weakness of selective PHC by", "options": ["combining the management of the main childhood illnesses in one approach instead of separate vertical programmes", "treating only one disease at a time", "removing immunisation from PHC", "focusing on adults only"], "answer": 0, "explain": "IMCI integrates care for the sick child."},
    {"id": "PHC-210", "topic": "Selective Primary Health Care", "q": "GOBI was later expanded to GOBI-FFF, where the three Fs stand for", "options": ["family planning, female education and food supplementation", "fever, fracture and fainting", "fruits, fish and flour", "funding, facilities and furniture"], "answer": 0, "explain": "The Fs were added to address wider causes of child ill health."},
    {"id": "PHC-211", "topic": "Selective Primary Health Care", "q": "UNICEF's GOBI strategy formed part of the campaign known as the", "options": ["Green Revolution", "Bamako Initiative", "Ward Health System", "Child Survival Revolution"], "answer": 3, "explain": "The Child Survival Revolution was launched in the early 1980s."},
    {"id": "PHC-212", "topic": "Selective Primary Health Care", "q": "The 1979 conference where selective PHC ideas were discussed was held at", "options": ["Alma-Ata, USSR", "Bamako, Mali", "Ottawa, Canada", "Bellagio, Italy"], "answer": 3, "explain": "The Bellagio conference was sponsored by the Rockefeller Foundation."},
    {"id": "PHC-213", "topic": "Selective Primary Health Care", "q": "A major criticism of selective PHC is that it", "options": ["ignores the social and economic causes of ill health and community participation", "covers too many diseases", "is too expensive", "was invented by WHO in 1948"], "answer": 0, "explain": "Critics say it narrows PHC to technical, top-down interventions."},
    {"id": "PHC-214", "topic": "Selective Primary Health Care", "q": "An advantage of selective PHC is that", "options": ["its results are easier to measure and show quickly", "it addresses all causes of ill health", "it requires no funding", "it encourages full community control"], "answer": 0, "explain": "Targeted interventions give measurable short-term results."},
    {"id": "PHC-215", "topic": "Selective Primary Health Care", "q": "Selective PHC programmes are often described as \"vertical\" because they", "options": ["are integrated into all health services", "depend on the community for planning", "are planned and managed from the top for a single disease or intervention", "involve building tall hospitals"], "answer": 2, "explain": "Vertical programmes run separately from the general health system."},
    {"id": "PHC-216", "topic": "Selective Primary Health Care", "q": "In selecting diseases for selective PHC, Walsh and Warren considered prevalence, mortality, morbidity and", "options": ["the feasibility and cost-effectiveness of control", "the beauty of the disease name", "the popularity of the disease", "the number of hospitals"], "answer": 0, "explain": "Diseases were ranked by impact and ease of control."},
    {"id": "PHC-217", "topic": "Selective Primary Health Care", "q": "Oral rehydration therapy is mainly used to prevent death from", "options": ["measles", "tuberculosis", "dehydration due to diarrhoea", "malaria"], "answer": 2, "explain": "ORT replaces lost fluids and salts."},
    {"id": "PHC-218", "topic": "Selective Primary Health Care", "q": "Growth monitoring of children under five is done mainly to", "options": ["detect growth faltering and malnutrition early", "measure intelligence", "check eyesight", "test hearing"], "answer": 0, "explain": "Regular weighing shows whether a child is growing normally."},
    {"id": "PHC-219", "topic": "Selective Primary Health Care", "q": "Female education was included in GOBI-FFF because", "options": ["it increases child mortality", "it reduces vaccine supply", "educated mothers are more likely to adopt good health practices for their children", "it replaces breastfeeding"], "answer": 2, "explain": "Maternal education strongly improves child health."},
    {"id": "PHC-220", "topic": "Selective Primary Health Care", "q": "Compared with comprehensive PHC, selective PHC is", "options": ["broader in scope", "identical in all respects", "narrower in scope and more disease-focused", "concerned mainly with tertiary hospitals"], "answer": 2, "explain": "Selective PHC targets a limited set of interventions."},
    {"id": "PHC-221", "topic": "Constraints to PHC Implementation in Nigeria", "q": "A major constraint to PHC in Nigeria is", "options": ["too many health workers in rural areas", "excess drugs in all clinics", "inadequate funding", "over-participation by communities"], "answer": 2, "explain": "PHC facilities are often poorly funded."},
    {"id": "PHC-222", "topic": "Constraints to PHC Implementation in Nigeria", "q": "The movement of Nigerian doctors and nurses to work abroad, which worsens staff shortages, is known as", "options": ["brain drain", "brain gain", "task shifting", "counter-referral"], "answer": 0, "explain": "Brain drain reduces the health workforce."},
    {"id": "PHC-223", "topic": "Constraints to PHC Implementation in Nigeria", "q": "The concentration of health workers in cities while rural PHC centres lack staff is a problem of", "options": ["over-supply of rural workers", "equity", "maldistribution of health personnel", "community participation"], "answer": 2, "explain": "Many workers prefer urban postings."},
    {"id": "PHC-224", "topic": "Constraints to PHC Implementation in Nigeria", "q": "Frequent changes in government and health policies affect PHC mainly by", "options": ["improving programme stability", "increasing funding automatically", "strengthening the referral system", "disrupting the continuity of programmes"], "answer": 3, "explain": "Policy inconsistency weakens implementation."},
    {"id": "PHC-225", "topic": "Constraints to PHC Implementation in Nigeria", "q": "When communities do not attend meetings or support their health centre because they were never involved in planning, the constraint is", "options": ["excessive intersectoral collaboration", "poor community participation", "too many drugs", "too much supervision"], "answer": 1, "explain": "People support what they help to plan."},
    {"id": "PHC-226", "topic": "Constraints to PHC Implementation in Nigeria", "q": "Frequent stock-outs of essential drugs and vaccines at primary health centres reduce", "options": ["the workload of hospitals", "the cost of care", "public confidence and use of PHC services", "community participation in a positive way"], "answer": 2, "explain": "People avoid facilities without drugs."},
    {"id": "PHC-227", "topic": "Constraints to PHC Implementation in Nigeria", "q": "Poor roads, lack of electricity and dilapidated buildings at health centres are examples of", "options": ["poor infrastructure", "strong political commitment", "equity", "appropriate technology"], "answer": 0, "explain": "Infrastructure problems hinder PHC delivery."},
    {"id": "PHC-228", "topic": "Constraints to PHC Implementation in Nigeria", "q": "The diversion of PHC funds for personal use by officials is a constraint known as", "options": ["intersectoral collaboration", "community financing", "corruption and mismanagement", "decentralisation"], "answer": 2, "explain": "Corruption reduces resources available for services."},
    {"id": "PHC-229", "topic": "Constraints to PHC Implementation in Nigeria", "q": "Patients going straight to teaching hospitals for minor illnesses and a lack of feedback from hospitals to PHC centres indicate", "options": ["a strong referral system", "a weak referral system", "good integration", "community participation"], "answer": 1, "explain": "Referral and counter-referral are often poorly organised."},
    {"id": "PHC-230", "topic": "Constraints to PHC Implementation in Nigeria", "q": "Belief that diseases are caused by witchcraft, leading people to avoid health centres, is a", "options": ["financial constraint", "political constraint", "socio-cultural constraint", "technological constraint"], "answer": 2, "explain": "Beliefs influence health-seeking behaviour."},
    {"id": "PHC-231", "topic": "Constraints to PHC Implementation in Nigeria", "q": "Heavy dependence on foreign donors for PHC programmes is a constraint because", "options": ["donors always provide enough money forever", "it increases national self-reliance", "it removes the need for planning", "programmes may collapse when donor funding stops"], "answer": 3, "explain": "Over-reliance threatens sustainability."},
    {"id": "PHC-232", "topic": "Constraints to PHC Implementation in Nigeria", "q": "Frequent strikes by health workers due to poor pay and working conditions affect PHC by", "options": ["interrupting service delivery", "improving service quality", "increasing immunisation coverage", "reducing maternal deaths"], "answer": 0, "explain": "Strikes leave communities without services."},
    {"id": "PHC-233", "topic": "Constraints to PHC Implementation in Nigeria", "q": "Before the PHCUOR policy, management of PHC in many states was split among several agencies. This constraint is called", "options": ["integration", "decentralisation", "fragmentation of PHC management", "equity"], "answer": 2, "explain": "Fragmentation causes duplication and confusion."},
    {"id": "PHC-234", "topic": "Constraints to PHC Implementation in Nigeria", "q": "When the health ministry builds a clinic but the water ministry fails to provide water to it, the constraint is", "options": ["excess community participation", "appropriate technology", "poor intersectoral collaboration", "good referral"], "answer": 2, "explain": "Health depends on cooperation with other sectors."},
    {"id": "PHC-235", "topic": "Constraints to PHC Implementation in Nigeria", "q": "Missing, incomplete or inaccurate records at PHC facilities reflect", "options": ["a weak health information system", "strong data management", "good supervision", "adequate funding"], "answer": 0, "explain": "Poor data make planning difficult."},
    {"id": "PHC-236", "topic": "Constraints to PHC Implementation in Nigeria", "q": "Low literacy in some communities is a constraint to PHC because it", "options": ["improves health knowledge", "increases the number of doctors", "makes health education and understanding of instructions more difficult", "reduces disease"], "answer": 2, "explain": "Literacy affects understanding of health messages."},
    {"id": "PHC-237", "topic": "Constraints to PHC Implementation in Nigeria", "q": "Insecurity in parts of northern Nigeria constrains PHC mainly by", "options": ["increasing vaccine supply", "reducing the cost of care", "preventing health workers from reaching communities and disrupting campaigns", "improving referral"], "answer": 2, "explain": "Conflict endangers workers and patients."},
    {"id": "PHC-238", "topic": "Constraints to PHC Implementation in Nigeria", "q": "Lack of financial autonomy of Local Government Areas affects PHC because", "options": ["LGAs have too much money", "states give LGAs more than they need", "it improves PHC funding", "LGAs, which are responsible for PHC, often lack funds to run services"], "answer": 3, "explain": "Inadequate LGA funds weaken the primary tier."},
    {"id": "PHC-239", "topic": "Constraints to PHC Implementation in Nigeria", "q": "Inadequate supervision and monitoring of PHC workers can lead to", "options": ["better performance", "more motivated staff", "poor quality of services and absenteeism", "improved records"], "answer": 2, "explain": "Supervision maintains standards."},
    {"id": "PHC-240", "topic": "Constraints to PHC Implementation in Nigeria", "q": "Rapid population growth constrains PHC because", "options": ["it reduces the demand for health care", "it reduces the number of children", "demand for services grows faster than resources", "it increases funding automatically"], "answer": 2, "explain": "More people need more services and staff."},
    {"id": "PHC-241", "topic": "Constraints to PHC Implementation in Nigeria", "q": "Poor attitude of some health workers towards patients at PHC facilities can lead to", "options": ["more people using the facility", "low patient satisfaction and reduced use of services", "better health outcomes", "improved community participation"], "answer": 1, "explain": "Patients avoid facilities where they are treated badly."},
    {"id": "PHC-242", "topic": "Constraints to PHC Implementation in Nigeria", "q": "Long distances to health facilities and lack of transport in rural areas mainly limit", "options": ["the number of diseases", "geographical access to PHC services", "the cost of drugs in cities", "the training of doctors"], "answer": 1, "explain": "People may not reach services in time."},
    {"id": "PHC-243", "topic": "Setting up a PHC System in a Local Government Area", "q": "Collecting baseline information on the population, health problems and resources of an LGA before planning PHC is called", "options": ["situation analysis (community diagnosis)", "counter-referral", "drug procurement", "immunisation"], "answer": 0, "explain": "Planning must be based on accurate knowledge of the area."},
    {"id": "PHC-244", "topic": "Setting up a PHC System in a Local Government Area", "q": "In setting up PHC in an LGA, dividing the LGA into districts or wards and drawing a map of settlements and facilities is called", "options": ["referral", "mapping", "auditing", "budgeting"], "answer": 1, "explain": "Mapping shows where people live and where services are needed."},
    {"id": "PHC-245", "topic": "Setting up a PHC System in a Local Government Area", "q": "The officer who heads the primary health care department of a Local Government Area is commonly called the", "options": ["Chief Medical Director", "PHC Coordinator", "Vice-Chancellor", "Commissioner for Health"], "answer": 1, "explain": "The PHC Coordinator manages PHC activities in the LGA."},
    {"id": "PHC-246", "topic": "Setting up a PHC System in a Local Government Area", "q": "Forming PHC or development committees at village, district and LGA levels is done mainly to", "options": ["replace health workers", "ensure community involvement in PHC", "collect taxes", "build teaching hospitals"], "answer": 1, "explain": "Committees provide channels for participation."},
    {"id": "PHC-247", "topic": "Setting up a PHC System in a Local Government Area", "q": "After situation analysis, the next major step in establishing PHC in an LGA is", "options": ["planning, including setting priorities and objectives", "closing existing clinics", "importing specialists", "building a teaching hospital"], "answer": 0, "explain": "Plans are drawn up based on identified needs."},
    {"id": "PHC-248", "topic": "Setting up a PHC System in a Local Government Area", "q": "Setting priorities during PHC planning means", "options": ["deciding which health problems should be addressed first based on their importance and feasibility", "treating every problem at the same time", "choosing problems randomly", "ignoring community views"], "answer": 0, "explain": "Limited resources require choices."},
    {"id": "PHC-249", "topic": "Setting up a PHC System in a Local Government Area", "q": "In setting up PHC in an LGA, a population census is useful mainly for", "options": ["estimating needs such as the number of children to immunise and facilities required", "deciding the colour of buildings", "choosing the LGA chairman", "selecting teaching hospitals"], "answer": 0, "explain": "Population figures guide planning and targets."},
    {"id": "PHC-250", "topic": "Setting up a PHC System in a Local Government Area", "q": "Before PHC services begin in an LGA, health workers such as CHEWs and village health workers must be", "options": ["recruited and trained", "sent abroad permanently", "replaced by specialists", "dismissed"], "answer": 0, "explain": "Trained personnel are essential for service delivery."},
    {"id": "PHC-251", "topic": "Setting up a PHC System in a Local Government Area", "q": "The provision of buildings, equipment, drugs and vaccines to health facilities in the LGA is part of", "options": ["community diagnosis", "health education", "evaluation", "logistics and supplies planning"], "answer": 3, "explain": "Facilities must be equipped before services start."},
    {"id": "PHC-252", "topic": "Setting up a PHC System in a Local Government Area", "q": "Establishing a clear arrangement for sending patients from village health posts to the PHC centre and then to the general hospital is setting up a", "options": ["referral system", "revolving fund", "census", "health education campaign"], "answer": 0, "explain": "Referral links facilities within and beyond the LGA."},
    {"id": "PHC-253", "topic": "Setting up a PHC System in a Local Government Area", "q": "Keeping records of births, deaths, immunisations and clinic attendance in the LGA is part of establishing", "options": ["a referral system", "a drug revolving fund", "a supervision checklist only", "a health information system"], "answer": 3, "explain": "Records support planning, monitoring and evaluation."},
    {"id": "PHC-254", "topic": "Setting up a PHC System in a Local Government Area", "q": "Measuring whether the PHC programme in the LGA has achieved its objectives, such as increased immunisation coverage, is", "options": ["mapping", "recruitment", "census", "evaluation"], "answer": 3, "explain": "Evaluation assesses outcomes against objectives."},
    {"id": "PHC-255", "topic": "Setting up a PHC System in a Local Government Area", "q": "Obtaining the approval and support of the LGA council and traditional leaders before starting PHC activities is important to", "options": ["avoid the community", "reduce participation", "secure political and community support", "delay all services"], "answer": 2, "explain": "Leadership support helps mobilise resources and people."},
    {"id": "PHC-256", "topic": "Setting up a PHC System in a Local Government Area", "q": "In planning PHC facilities in an LGA, health posts should be sited", "options": ["only near the LGA chairman's house", "where they can be easily reached by the communities they serve", "only in the LGA headquarters", "far from villages"], "answer": 1, "explain": "Location should maximise accessibility."},
    {"id": "PHC-257", "topic": "Setting up a PHC System in a Local Government Area", "q": "A plan of PHC activities in the LGA that shows what will be done, by whom, when and with what resources is called", "options": ["a referral note", "a work plan (operational plan)", "a census", "a prescription"], "answer": 1, "explain": "Operational plans guide implementation."},
    {"id": "PHC-258", "topic": "Setting up a PHC System in a Local Government Area", "q": "In PHC planning for an LGA, an objective such as \"to raise measles immunisation coverage from 50% to 80% within one year\" is a good objective because it is", "options": ["specific, measurable and time-bound", "vague and general", "impossible to measure", "unrelated to health"], "answer": 0, "explain": "Good objectives are SMART."},
    {"id": "PHC-259", "topic": "Setting up a PHC System in a Local Government Area", "q": "The community should be involved in choosing the site of a new health post mainly so that", "options": ["the LGA chairman can choose freely", "people will avoid the facility", "the site is acceptable and accessible, and the community feels ownership of it", "costs will increase"], "answer": 2, "explain": "Community involvement improves use and care of facilities."},
    {"id": "PHC-260", "topic": "Setting up a PHC System in a Local Government Area", "q": "When an LGA uses data from its situation analysis to decide how many PHC centres to build and where, it is practising", "options": ["guesswork", "evidence-based planning", "selective referral", "political patronage"], "answer": 1, "explain": "Decisions should be based on data."},
    {"id": "PHC-261", "topic": "Setting up a PHC System in a Local Government Area", "q": "Using indicators such as the percentage of children fully immunised to track PHC performance in the LGA is part of", "options": ["mapping", "recruitment", "census taking", "monitoring"], "answer": 3, "explain": "Indicators show progress over time."},
    {"id": "PHC-262", "topic": "Setting up a PHC System in a Local Government Area", "q": "Regularly checking the work of PHC staff in health posts to guide and correct them is", "options": ["supervision", "census", "mapping", "budgeting"], "answer": 0, "explain": "Supervision ensures quality and accountability."},
    {"id": "PHC-263", "topic": "Primary Health Care Committees", "q": "The main purpose of PHC committees is to", "options": ["replace doctors in hospitals", "collect taxes for the government", "involve the community in planning, implementing and monitoring health services", "run teaching hospitals"], "answer": 2, "explain": "Committees are the main vehicle for community participation."},
    {"id": "PHC-264", "topic": "Primary Health Care Committees", "q": "A committee at the community level that mobilises villagers for health and development activities is usually called the", "options": ["Village Development Committee (VDC)", "National Council on Health", "Senate Committee on Health", "Board of a teaching hospital"], "answer": 0, "explain": "VDCs operate at the village or community level."},
    {"id": "PHC-265", "topic": "Primary Health Care Committees", "q": "Under the Ward Health System, the committee responsible for overseeing PHC activities in a political ward is the", "options": ["Ward Development Committee (WDC)", "National Council on Health", "Federal Executive Council", "Hospital Management Board"], "answer": 0, "explain": "Each ward should have a WDC."},
