<!doctype html>
<html lang="en">
<head>
  <!-- ONE-FILE VERSION: built by tools/build-bundle.js. The settings and Firebase keys are just below. -->
  <meta charset="utf-8">
  <script>
/* ##################################################################
   ##  SETTINGS AND FIREBASE KEYS: EDIT THIS PART  (search: PASTE KEYS)
   ################################################################## */
/*
 * =====================================================================
 *  CBT PRACTICE: SETTINGS FILE
 *  This is the ONLY file you need to edit to connect Firebase and to
 *  change exam settings. Keep the quotes "" and commas , exactly as
 *  they are and only change the values.
 * =====================================================================
 */
window.CBT_CONFIG = {

  /* -------------------------------------------------------------------
   * 1. FIREBASE KEYS
   * Paste the values from: Firebase console > Project settings (gear icon)
   * > General > Your apps > SDK setup and configuration > Config.
   *
   * While apiKey and projectId are empty, the site runs in DEMO MODE:
   * everything works, but scores are saved only on that one phone and
   * the leaderboard is NOT shared. Fill these in to share it with the class.
   * ------------------------------------------------------------------- */
  firebase: {   /* PASTE KEYS below */
    apiKey: "",
    authDomain: "",
    projectId: "",
    storageBucket: "",
    messagingSenderId: "",
    appId: ""
  },

  /* -------------------------------------------------------------------
   * 2. EXAM SETTINGS
   * ------------------------------------------------------------------- */
  siteName: "CBT Practice Arena",       // shown at the top of every page
  className: "100 Level",               // shown under the site name
  questionsPerCourse: 45,               // questions per course in each exam (45 x 4 = 180, like JAMB)
  examMinutes: 120,                     // total time for ALL courses together
  warnAtMinutes: 10,                    // timer turns amber and shows a warning
  dangerAtMinutes: 5,                   // timer turns red and blinks

  /* Courses in the order the tabs appear. The code must match the code
   * inside the question file (js/questions/xxx.js). */
  courses: [
    { code: "GST", title: "Use of English" },
    { code: "PHC", title: "Primary Health Care" },
    { code: "CHM", title: "General Chemistry" },
    { code: "AUM", title: "Action and Use of Medicine" }
  ],

  /* -------------------------------------------------------------------
   * 3. LOGIN SETTINGS
   * requirePin: true  = students choose a 4 digit PIN at sign up and must
   *                     type it to log in (stops people logging in as others).
   * requirePin: false = log in with matric number only.
   * Decide this BEFORE sharing the link. Accounts created while it was
   * false have no PIN and can still log in with matric number only.
   * ------------------------------------------------------------------- */
  requirePin: false,

  /* -------------------------------------------------------------------
   * 4. LEADERBOARD SETTINGS
   * leaderboardSize: how many students are loaded and shown live.
   * Each phone that opens the dashboard reads this many records once,
   * so lower it (e.g. 50) if you ever get close to the free Firebase limit.
   * ------------------------------------------------------------------- */
  leaderboardSize: 100,

  /* Footer credit on the login and dashboard pages */
  credit: "Designed by Faruk Dynova"
};
/* ##################  END OF SETTINGS  ################## */
</script>

  <style>
/* CBT Practice: custom styles (Tailwind handles the rest).
   Palette: white and blue only (green/red only for correct/wrong). */
:root {
  --blue: #1d4ed8;
  --blue-dark: #1e3a8a;
  --blue-light: #eff6ff;
  --blue-100: #dbeafe;
  --ink: #0f172a;
  --muted: #64748b;
  --green: #15803d;
  --red: #dc2626;
}

html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: #f5f8ff;
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
  padding-bottom: env(safe-area-inset-bottom);
}
button { font-family: inherit; }
button:disabled { cursor: not-allowed; opacity: .55; }

/* ---------- surfaces ---------- */
.card {
  background: #fff;
  border-radius: 1.5rem;
  box-shadow: 0 1px 2px rgba(30, 58, 138, .06), 0 8px 24px rgba(30, 58, 138, .07);
  border: 1px solid #e8efff;
}
.hero { background: radial-gradient(1200px 400px at 50% -10%, #3b82f6 0%, var(--blue) 45%, var(--blue-dark) 100%); }
.hero-card { background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%); }
.section-title { font-weight: 800; color: var(--blue-dark); font-size: 1.05rem; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: 48px; padding: .75rem 1.25rem; border-radius: 1rem;
  font-weight: 700; font-size: .95rem; line-height: 1.2;
  transition: transform .12s ease, background-color .15s ease, box-shadow .15s ease, color .15s ease;
  border: 1px solid transparent; cursor: pointer; user-select: none;
}
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:focus-visible, .opt:focus-visible, .pal:focus-visible, .tab:focus-visible, .icon-btn:focus-visible, .fchip:focus-visible, .link:focus-visible {
  outline: 3px solid #93c5fd; outline-offset: 2px;
}
.btn-sm { min-height: 40px; padding: .5rem .9rem; font-size: .85rem; border-radius: .85rem; }
.btn-primary { background: var(--blue); color: #fff; box-shadow: 0 6px 16px rgba(29, 78, 216, .28); }
.btn-primary:hover:not(:disabled) { background: #1e40af; }
.btn-ghost { background: #fff; color: var(--blue-dark); border-color: #c7d7fe; }
.btn-ghost:hover:not(:disabled) { background: var(--blue-light); }
.btn-danger { background: var(--red); color: #fff; }
.btn-light { background: #fff; color: var(--blue); box-shadow: 0 8px 20px rgba(15, 23, 42, .18); }
.btn-light:hover:not(:disabled) { background: var(--blue-light); }
.btn-outline-light { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .5); }
.btn-outline-light:hover { background: rgba(255, 255, 255, .1); }
.icon-btn {
  width: 40px; height: 40px; border-radius: .85rem; display: inline-flex; align-items: center; justify-content: center;
  color: var(--blue-dark); background: var(--blue-light); flex-shrink: 0; border: 0; cursor: pointer;
}
.link { color: var(--blue); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; cursor: pointer; padding: 0; }

/* ---------- form ---------- */
.input {
  width: 100%; min-height: 50px; padding: .8rem 1rem; border-radius: 1rem;
  border: 1.5px solid #c7d7fe; background: #fff; font-size: 16px; font-weight: 600; color: var(--ink);
  transition: border-color .15s ease, box-shadow .15s ease; box-sizing: border-box;
}
.input::placeholder { color: #a3b3cc; font-weight: 500; }
.input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(29, 78, 216, .15); }

/* ---------- small bits ---------- */
.avatar {
  border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center;
  font-weight: 800; background: var(--blue-light); color: var(--blue-dark); border: 2px solid #dbeafe;
}
.avatar-light { background: rgba(255, 255, 255, .18); color: #fff; border-color: rgba(255, 255, 255, .45); flex-shrink: 0; }
.chip { display: inline-block; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: .2rem .6rem; border-radius: 999px; background: var(--blue-light); color: var(--blue-dark); font-size: 11px; font-weight: 700; }
.course-badge { width: 48px; height: 48px; border-radius: 1rem; background: var(--blue-light); color: var(--blue); font-weight: 800; font-size: .8rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.bar { height: 10px; background: var(--blue-100); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, var(--blue)); border-radius: 999px; transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.status-pill { display: inline-flex; align-items: center; gap: .4rem; padding: .25rem .65rem; border-radius: 999px; font-size: 11px; font-weight: 800; }
.dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
.dot-live { box-shadow: 0 0 0 0 rgba(34, 197, 94, .6); animation: live 1.8s infinite; }
@keyframes live { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, .55); } 70% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
.you-tag { display: inline-block; vertical-align: middle; margin-left: .25rem; padding: .05rem .4rem; border-radius: 999px; background: var(--blue); color: #fff; font-size: 10px; font-weight: 800; }
.skeleton { border-radius: 1rem; background: linear-gradient(90deg, #eef3ff 25%, #f8faff 50%, #eef3ff 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.no-scrollbar { scrollbar-width: none; } .no-scrollbar::-webkit-scrollbar { display: none; }

.spinner { width: 18px; height: 18px; border-radius: 999px; border: 2.5px solid rgba(255, 255, 255, .45); border-top-color: #fff; display: inline-block; animation: spin .7s linear infinite; flex-shrink: 0; }
.spinner-blue { border-color: #bfdbfe; border-top-color: var(--blue); }
@keyframes spin { to { transform: rotate(360deg); } }

.fade-in { animation: fadeIn .35s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- toasts & modal ---------- */
#toast-root { position: fixed; z-index: 60; bottom: calc(16px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: min(92vw, 420px); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { animation: toastIn .25s ease both; }
.toast-out { animation: toastOut .3s ease both; }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(10px); } }
.modal-backdrop { animation: fadeIn .2s ease both; }
.modal-panel { animation: sheetIn .25s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes sheetIn { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- exam ---------- */
.timer {
  display: inline-flex; align-items: center; gap: .4rem; padding: .5rem .8rem; border-radius: .9rem;
  font-weight: 800; font-variant-numeric: tabular-nums; font-size: 1rem;
  background: var(--blue-light); color: var(--blue-dark); border: 1.5px solid #c7d7fe; white-space: nowrap;
  transition: background-color .3s ease, color .3s ease;
}
.timer-warn { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
.timer-danger { background: var(--red); color: #fff; border-color: var(--red); animation: blink 1s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: .45; } }

.tab {
  display: inline-flex; align-items: center; gap: .5rem; white-space: nowrap;
  padding: .55rem .9rem; border-radius: .9rem; font-size: .85rem; border: 1.5px solid #c7d7fe;
  background: #fff; color: var(--blue-dark); cursor: pointer; transition: all .15s ease; flex-shrink: 0;
}
.tab-count { font-size: 11px; font-weight: 800; padding: .1rem .45rem; border-radius: 999px; background: var(--blue-light); color: var(--blue); }
/* On phones, stretch the course tabs so all four fit without scrolling */
@media (max-width: 639px) {
  .tabs-fit .tab { flex: 1 0 auto; justify-content: center; padding: .5rem .45rem; gap: .3rem; font-size: .8rem; }
  .tabs-fit .tab-count { padding: .05rem .35rem; font-size: 10px; }
}
.tab-on { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 6px 14px rgba(29, 78, 216, .25); }
.tab-on .tab-count { background: rgba(255, 255, 255, .2); color: #fff; }

.q-text { font-size: 1.12rem; line-height: 1.6; font-weight: 700; color: var(--ink); }
@media (min-width: 640px) { .q-text { font-size: 1.22rem; } }
.opt {
  width: 100%; display: flex; align-items: center; gap: .85rem; text-align: left;
  padding: .85rem 1rem; min-height: 56px; border-radius: 1rem; border: 1.5px solid #dbe5fb; background: #fff;
  font-size: .98rem; font-weight: 600; color: #1e293b; cursor: pointer;
  transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease, transform .1s ease;
}
.opt:hover { border-color: #93c5fd; background: #f8fbff; }
.opt:active { transform: scale(.99); }
.opt-letter {
  width: 34px; height: 34px; border-radius: .7rem; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  font-weight: 800; font-size: .9rem; background: var(--blue-light); color: var(--blue);
}
.opt-on { border-color: var(--blue); background: var(--blue-light); box-shadow: 0 0 0 3px rgba(29, 78, 216, .12); color: var(--blue-dark); }
.opt-on .opt-letter { background: var(--blue); color: #fff; }

.pal {
  aspect-ratio: 1 / 1; min-height: 36px; border-radius: .7rem; font-size: .8rem; font-weight: 800;
  border: 1.5px solid #c7d7fe; background: #fff; color: var(--blue-dark); cursor: pointer; transition: all .12s ease;
}
.pal-done { background: var(--blue); border-color: var(--blue); color: #fff; }
.pal-cur { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--blue-dark); }
.legend { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid #c7d7fe; background: #fff; display: inline-block; }
.legend.pal-done { background: var(--blue); border-color: var(--blue); }
.legend.pal-cur { box-shadow: 0 0 0 1px #fff, 0 0 0 3px var(--blue-dark); }

/* ---------- leaderboard ---------- */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: .5rem; padding-top: .5rem; }
.podium-col { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
.podium-avatar {
  position: relative; width: 56px; height: 56px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 1.05rem; color: #fff; border: 3px solid #fff; box-shadow: 0 6px 16px rgba(15, 23, 42, .18);
}
.podium-gold .podium-avatar { width: 68px; height: 68px; font-size: 1.25rem; background: linear-gradient(135deg, #fde68a, #f59e0b 60%, #b45309); }
.podium-silver .podium-avatar { background: linear-gradient(135deg, #f1f5f9, #94a3b8 60%, #475569); }
.podium-bronze .podium-avatar { background: linear-gradient(135deg, #fed7aa, #c2702e 60%, #7c2d12); }
.podium-rank {
  position: absolute; bottom: -6px; right: -4px; width: 22px; height: 22px; border-radius: 999px; font-size: 11px;
  display: flex; align-items: center; justify-content: center; background: var(--blue-dark); color: #fff; border: 2px solid #fff;
}
.podium-name { margin-top: .6rem; font-weight: 800; font-size: .8rem; color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.podium-matric { font-size: 10px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.podium-pct { margin-top: .2rem; font-weight: 800; color: var(--blue-dark); font-size: 1rem; }
.podium-score { font-size: 11px; color: var(--muted); font-weight: 600; }
.podium-block {
  width: 100%; margin-top: .5rem; border-radius: 1rem 1rem .4rem .4rem; display: flex; align-items: flex-start; justify-content: center;
  padding-top: .4rem; font-weight: 800; color: rgba(255, 255, 255, .95); font-size: 1.1rem;
}
.podium-gold .podium-block { height: 84px; background: linear-gradient(180deg, #fbbf24, #d97706); }
.podium-silver .podium-block { height: 60px; background: linear-gradient(180deg, #cbd5e1, #94a3b8); }
.podium-bronze .podium-block { height: 44px; background: linear-gradient(180deg, #e2a26b, #b45309); }
.podium-me .podium-name { color: var(--blue); }

.lb-row { display: flex; align-items: center; gap: .75rem; padding: .6rem .75rem; border-radius: 1rem; background: #fff; border: 1px solid #edf2ff; }
.lb-pos { width: 28px; text-align: center; font-weight: 800; color: var(--muted); font-size: .85rem; flex-shrink: 0; }
.lb-me { background: var(--blue-light); border-color: #93c5fd; box-shadow: 0 0 0 2px rgba(29, 78, 216, .12); }
.lb-me .lb-pos { color: var(--blue); }

/* ---------- results & corrections ---------- */
.ring-fg { transition: stroke-dashoffset 1.2s cubic-bezier(.2, .8, .2, 1); }
.badge { display: inline-flex; align-items: center; gap: .4rem; padding: .45rem .85rem; border-radius: 999px; font-size: .8rem; font-weight: 800; }
.badge-best { background: #fef3c7; color: #92400e; }
.badge-rank { background: var(--blue-light); color: var(--blue-dark); }
.fchip { white-space: nowrap; padding: .45rem .85rem; border-radius: 999px; font-size: .8rem; font-weight: 700; border: 1.5px solid #c7d7fe; background: #fff; color: var(--blue-dark); cursor: pointer; flex-shrink: 0; }
.fchip-on { background: var(--blue-dark); border-color: var(--blue-dark); color: #fff; }
.copt { display: flex; align-items: center; gap: .75rem; padding: .7rem .85rem; border-radius: .9rem; border: 1.5px solid #e2e8f0; font-size: .93rem; font-weight: 600; color: #334155; flex-wrap: wrap; }
.copt-right { border-color: #86efac; background: #f0fdf4; color: #14532d; }
.copt-right .opt-letter { background: var(--green); color: #fff; }
.copt-wrong { border-color: #fca5a5; background: #fef2f2; color: #7f1d1d; }
.copt-wrong .opt-letter { background: var(--red); color: #fff; }
.ctag { display: inline-flex; align-items: center; gap: .25rem; font-size: 11px; font-weight: 800; padding: .15rem .5rem; border-radius: 999px; margin-left: auto; }
.ctag-right { background: var(--green); color: #fff; }
.ctag-wrong { background: var(--red); color: #fff; }
.sbadge { padding: .15rem .55rem; border-radius: 999px; font-size: 11px; font-weight: 800; }
.sbadge-right { background: #dcfce7; color: #166534; }
.sbadge-wrong { background: #fee2e2; color: #991b1b; }
.sbadge-skip { background: #f1f5f9; color: #475569; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

  <script>/* js/questions/gst.js */
/*
 * Use of English (GST) question bank: 332 questions.
 *
 * HOW TO EDIT:
 *  - Each question is one line: { id, topic, q, options, answer, explain }
 *  - options: exactly 4 choices. answer: index of the correct option (0 = first, 1 = second, 2 = third, 3 = fourth).

    {"id": "GST-088", "topic": "Reading Skills and Faulty Reading Habits", "q": "Moving the lips or pronouncing words softly while reading silently is called", "options": ["regression", "vocalisation", "scanning", "skimming"], "answer": 1, "explain": "Vocalisation slows down reading because the reader reads at speaking speed."},
    {"id": "GST-089", "topic": "Reading Skills and Faulty Reading Habits", "q": "Saying the words silently in the mind while reading is known as", "options": ["regression", "sub-vocalisation", "scanning", "fixation"], "answer": 1, "explain": "Sub-vocalisation is inner speech that reduces reading speed."},
    {"id": "GST-090", "topic": "Reading Skills and Faulty Reading Habits", "q": "Going back to re-read words or lines unnecessarily is a faulty reading habit called", "options": ["regression", "skimming", "fixation", "scanning"], "answer": 0, "explain": "Regression wastes time and breaks concentration."},
    {"id": "GST-091", "topic": "Reading Skills and Faulty Reading Habits", "q": "Tracing words with a finger or pen while reading is a faulty habit known as", "options": ["regression", "finger pointing", "sub-vocalisation", "skimming"], "answer": 1, "explain": "Finger pointing slows the eyes to the speed of the finger."},
    {"id": "GST-092", "topic": "Reading Skills and Faulty Reading Habits", "q": "Reading one word at a time instead of in meaningful groups of words is called", "options": ["skimming", "word-by-word reading", "scanning", "extensive reading"], "answer": 1, "explain": "Word-by-word reading reduces speed and comprehension."},
    {"id": "GST-093", "topic": "Reading Skills and Faulty Reading Habits", "q": "Moving the head from side to side along each line instead of moving only the eyes is a faulty habit called", "options": ["regression", "head movement", "scanning", "sub-vocalisation"], "answer": 1, "explain": "The eyes, not the head, should move across the line."},

    {"id": "GST-095", "topic": "Reading Skills and Faulty Reading Habits", "q": "The brief pause of the eyes on a word or group of words during reading is called", "options": ["a regression", "a fixation", "a scan", "a survey"], "answer": 1, "explain": "The eyes take in print only during fixations."},
    {"id": "GST-096", "topic": "Reading Skills and Faulty Reading Habits", "q": "Which reading practice improves both speed and comprehension?", "options": ["Reading in thought groups", "Pointing at every word", "Moving the lips", "Re-reading every line"], "answer": 0, "explain": "Reading phrases or thought groups helps the reader grasp meaning faster."},

    {"id": "GST-098", "topic": "Reading Skills and Faulty Reading Habits", "q": "Drawing a conclusion that is not directly stated in a passage is called", "options": ["scanning", "making an inference", "skimming", "paraphrasing"], "answer": 1, "explain": "Inference means reading between the lines."},

    {"id": "GST-271", "topic": "Punctuation", "q": "In \"We visited Lagos, Abuja and Kano\", the commas are used to", "options": ["end the sentence", "show possession", "separate items in a list", "introduce direct speech"], "answer": 2, "explain": "Commas separate items in a series."},
    {"id": "GST-272", "topic": "Punctuation", "q": "In \"It's raining\", the apostrophe shows", "options": ["possession", "plural form", "a quotation", "that letters have been left out (it is)"], "answer": 3, "explain": "It's is a contraction of it is or it has."},
    {"id": "GST-273", "topic": "Punctuation", "q": "Choose the correct option: \"The dog wagged ___ tail.\"", "options": ["its", "it's", "its'", "it is"], "answer": 0, "explain": "Its, without an apostrophe, is the possessive form."},
    {"id": "GST-274", "topic": "Punctuation", "q": "A colon is commonly used to", "options": ["end a question", "join two words into one", "introduce a list or an explanation", "show possession"], "answer": 2, "explain": "For example: \"You need three things: a pen, paper and ink.\""},
    {"id": "GST-275", "topic": "Punctuation", "q": "A semicolon is used to", "options": ["end a question", "join two closely related independent clauses", "introduce direct speech", "show strong emotion"], "answer": 1, "explain": "For example: \"She studied hard; she passed.\""},
    {"id": "GST-276", "topic": "Punctuation", "q": "Quotation marks are mainly used to", "options": ["show possession", "separate items in a list", "end a sentence", "enclose the exact words of a speaker"], "answer": 3, "explain": "Quotation marks enclose direct speech and quotations."},
    {"id": "GST-277", "topic": "Punctuation", "q": "The hyphen is used in words such as \"well-known\" to", "options": ["join parts of a compound word", "show possession", "end a sentence", "introduce a list"], "answer": 0, "explain": "Hyphens join compound words and some prefixes."},
    {"id": "GST-278", "topic": "Punctuation", "q": "Brackets (parentheses) are used to", "options": ["end a sentence", "show possession", "join independent clauses", "enclose additional or explanatory information"], "answer": 3, "explain": "Parenthetical information can be removed without changing the main meaning."},
    {"id": "GST-279", "topic": "Punctuation", "q": "A capital letter is required", "options": ["for every verb", "for every adjective", "only in the middle of a sentence", "at the beginning of a sentence and for proper nouns"], "answer": 3, "explain": "Sentences and proper nouns begin with capital letters."},
    {"id": "GST-280", "topic": "Punctuation", "q": "An exclamation mark is used to show", "options": ["a question", "strong emotion or surprise", "possession", "a pause"], "answer": 1, "explain": "For example: \"What a goal!\""},
    {"id": "GST-281", "topic": "Punctuation", "q": "Which of the following sentences is correctly punctuated?", "options": ["However the meeting, was postponed.", "However; the meeting was postponed.", "However, the meeting was postponed.", "However the meeting was postponed?"], "answer": 2, "explain": "Introductory words like however are followed by a comma."},
    {"id": "GST-282", "topic": "Punctuation", "q": "Joining two independent clauses with only a comma, as in \"I came, he left\", is an error called", "options": ["a fragment", "an ellipsis", "a hyphenation", "a comma splice"], "answer": 3, "explain": "A comma splice needs a semicolon, a conjunction or a full stop."},
    {"id": "GST-283", "topic": "Punctuation", "q": "The ellipsis (...) is used to show", "options": ["that words have been omitted", "possession", "a list", "a compound word"], "answer": 0, "explain": "An ellipsis marks omitted words or an unfinished thought."},
    {"id": "GST-284", "topic": "Punctuation", "q": "Choose the correctly punctuated phrase meaning toys belonging to the children:", "options": ["the childrens' toys", "the childrens toys", "the children's toys", "the children toy's"], "answer": 2, "explain": "Children is already plural, so add 's."},
    {"id": "GST-285", "topic": "Punctuation", "q": "Which sentence correctly uses a comma after an introductory clause?", "options": ["When we arrived, the hall was full.", "When we arrived the hall, was full.", "When, we arrived the hall was full.", "When we arrived the, hall was full."], "answer": 0, "explain": "A comma separates an introductory dependent clause from the main clause."},
    {"id": "GST-286", "topic": "Punctuation", "q": "In the time \"10:30 a.m.\", the punctuation mark separating the hour from the minutes is the", "options": ["semicolon", "comma", "colon", "hyphen"], "answer": 2, "explain": "Colons are used in writing time in this format."},
    {"id": "GST-287", "topic": "Punctuation", "q": "In \"Ngozi, come here\", the comma is used to", "options": ["separate items in a list", "join two clauses", "show possession", "set off a name in direct address"], "answer": 3, "explain": "Names of people being spoken to are set off by commas."},
    {"id": "GST-288", "topic": "Punctuation", "q": "Which of these uses the apostrophe wrongly?", "options": ["The boy's bag", "Apple's for sale", "It's late", "Don't go"], "answer": 1, "explain": "Apostrophes are not used to form ordinary plurals; it should be \"Apples for sale\"."},
    {"id": "GST-289", "topic": "Punctuation", "q": "The oblique or slash (/) is commonly used to", "options": ["end a sentence", "introduce a quotation", "show alternatives, as in \"and/or\"", "show strong emotion"], "answer": 2, "explain": "The slash separates alternatives."},
    {"id": "GST-290", "topic": "Punctuation", "q": "Which sentence is correctly punctuated?", "options": ["He asked where I lived?", "He asked, where I lived?", "He asked \"where I lived?\"", "He asked where I lived."], "answer": 3, "explain": "Indirect questions end with a full stop, not a question mark."},
    {"id": "GST-291", "topic": "Reported Speech", "q": "Change to reported speech: He said, \"I am tired.\"", "options": ["He said that I am tired.", "He said that he is tiring.", "He says that he was tired.", "He said that he was tired."], "answer": 3, "explain": "The present tense \"am\" moves back to \"was\" and \"I\" becomes \"he\"."},
    {"id": "GST-292", "topic": "Reported Speech", "q": "Change to reported speech: She said, \"I will come tomorrow.\"", "options": ["She said that she would come the next day.", "She said that she will come tomorrow.", "She said that I would come tomorrow.", "She said that she comes the next day."], "answer": 0, "explain": "Will becomes would and tomorrow becomes the next day."},
    {"id": "GST-293", "topic": "Reported Speech", "q": "In reported speech, the word \"here\" usually changes to", "options": ["where", "there", "hither", "this place now"], "answer": 1, "explain": "Words of place shift away from the speaker's position."},
    {"id": "GST-294", "topic": "Reported Speech", "q": "Change to reported speech: He said, \"Let's go to the cinema.\"", "options": ["He ordered to go to the cinema.", "He said let's go to the cinema.", "He suggested going to the cinema.", "He suggested that let us go to the cinema."], "answer": 2, "explain": "Suggestions with \"let's\" are reported with \"suggested\" plus a gerund or a that-clause."},
    {"id": "GST-295", "topic": "Reported Speech", "q": "Change to reported speech: He asked, \"Shall I open the window?\"", "options": ["He asked shall he open the window.", "He asked whether he should open the window.", "He asked that he opens the window.", "He asked whether I shall open the window?"], "answer": 1, "explain": "Shall in a question asking for advice becomes should."},
    {"id": "GST-296", "topic": "Reported Speech", "q": "In reported speech, \"yesterday\" usually changes to", "options": ["tomorrow", "the previous day", "the next day", "that day"], "answer": 1, "explain": "Yesterday becomes the day before or the previous day."},
    {"id": "GST-297", "topic": "Reported Speech", "q": "Change to reported speech: Tunde said, \"I have finished my work.\"", "options": ["Tunde said that he has finished my work.", "Tunde said that he had finished his work.", "Tunde said that he finished my work.", "Tunde said that I had finished his work."], "answer": 1, "explain": "The present perfect becomes the past perfect."},
    {"id": "GST-298", "topic": "Reported Speech", "q": "Change to reported speech: She said, \"I saw him at the market.\"", "options": ["She said that she sees him at the market.", "She said that she had seen him at the market.", "She said that I saw him at the market.", "She said that she has seen him at the market."], "answer": 1, "explain": "The simple past usually becomes the past perfect."},
    {"id": "GST-299", "topic": "Reported Speech", "q": "Change to reported speech: He asked me, \"Where do you live?\"", "options": ["He asked me where I lived.", "He asked me where do I live.", "He asked me where did I live?", "He asked me that where I lived."], "answer": 0, "explain": "Reported questions use statement word order and no question mark."},
    {"id": "GST-300", "topic": "Reported Speech", "q": "Change to reported speech: She asked, \"Are you coming?\"", "options": ["She asked are you coming.", "She asked that was I coming.", "She asked if I was coming.", "She asked if I am coming?"], "answer": 2, "explain": "Yes or no questions are reported with if or whether."},
    {"id": "GST-301", "topic": "Reported Speech", "q": "Change to reported speech: He said to me, \"Close the door.\"", "options": ["He told me that close the door.", "He said me to close the door.", "He told me closed the door.", "He told me to close the door."], "answer": 3, "explain": "Commands are reported with told or ordered plus the infinitive."},
    {"id": "GST-302", "topic": "Reported Speech", "q": "Change to reported speech: The teacher said to the pupils, \"Don't shout.\"", "options": ["The teacher told the pupils don't shout.", "The teacher said the pupils not shouting.", "The teacher told the pupils not to shout.", "The teacher told the pupils to not shouted."], "answer": 2, "explain": "Negative commands use \"not to\" plus the base verb."},
    {"id": "GST-303", "topic": "Reported Speech", "q": "Change to reported speech: The teacher said, \"The earth goes round the sun.\"", "options": ["The teacher said that the earth had gone round the sun.", "The teacher said that the earth goes round the sun.", "The teacher said that the earth would go round the sun.", "The teacher says that the earth went round the sun."], "answer": 1, "explain": "Universal truths usually keep the present tense in reported speech."},
    {"id": "GST-304", "topic": "Reported Speech", "q": "In reported speech, the modal \"can\" usually changes to", "options": ["could", "might", "should", "would"], "answer": 0, "explain": "Can moves back to could."},
    {"id": "GST-305", "topic": "Reported Speech", "q": "Change to reported speech: He said, \"I must leave now.\"", "options": ["He said that he must leave now.", "He said that I had to leave now.", "He said that he musted leave then.", "He said that he had to leave then."], "answer": 3, "explain": "Must often becomes had to, and now becomes then."},
    {"id": "GST-306", "topic": "Reported Speech", "q": "Change to reported speech: He says, \"I am busy.\"", "options": ["He says that he was busy.", "He said that he is busy.", "He says that he is busy.", "He says that I was busy."], "answer": 2, "explain": "When the reporting verb is in the present tense, the tense of the reported words does not change."},
    {"id": "GST-307", "topic": "Reported Speech", "q": "Change to reported speech: She said, \"What a lovely day!\"", "options": ["She exclaimed that it was a lovely day.", "She asked what a lovely day it was.", "She exclaimed what a lovely day!", "She said that what a lovely day it is."], "answer": 0, "explain": "Exclamations are reported with verbs like exclaimed and turned into statements."},
    {"id": "GST-308", "topic": "Reported Speech", "q": "Change to reported speech: The girls said, \"We are ready.\"", "options": ["The girls said that we are ready.", "The girls said that they are being ready.", "The girls said that they were ready.", "The girls said that we were ready."], "answer": 2, "explain": "We becomes they and are becomes were."},
    {"id": "GST-309", "topic": "Reported Speech", "q": "Change to reported speech: She said to me, \"Please help me.\"", "options": ["She asked me to help her.", "She asked me that help me.", "She told me please help me.", "She asked me to helped her."], "answer": 0, "explain": "Requests are reported with asked or requested plus the infinitive."},
    {"id": "GST-310", "topic": "Reported Speech", "q": "Change to reported speech: He said, \"I met her two years ago.\"", "options": ["He said that he met her two years ago.", "He said that he had met her two years before.", "He said that he has met her two years ago.", "He said that I had met her two years later."], "answer": 1, "explain": "Ago changes to before, and the past simple moves to the past perfect."},
    {"id": "GST-311", "topic": "Reported Speech", "q": "Another name for reported speech is", "options": ["direct speech", "quoted speech", "indirect speech", "free speech"], "answer": 2, "explain": "Reported speech is also called indirect speech."},
    {"id": "GST-312", "topic": "Concord", "q": "Concord in grammar refers to", "options": ["agreement between parts of a sentence, especially the subject and the verb", "the use of punctuation", "the arrangement of paragraphs", "the pronunciation of words"], "answer": 0, "explain": "Concord means grammatical agreement."},
    {"id": "GST-313", "topic": "Concord", "q": "Choose the correct verb: \"The news ___ good.\"", "options": ["are", "is", "were", "have been"], "answer": 1, "explain": "News is an uncountable noun that takes a singular verb."},
    {"id": "GST-314", "topic": "Concord", "q": "Choose the correct verb: \"Neither John nor his friends ___ coming.\"", "options": ["are", "is", "was", "has"], "answer": 0, "explain": "With neither/nor, the verb agrees with the nearer subject (friends)."},
    {"id": "GST-315", "topic": "Concord", "q": "Choose the correct verb: \"Each of the students ___ a textbook.\"", "options": ["have", "are having", "has", "were having"], "answer": 2, "explain": "Each is singular."},
    {"id": "GST-316", "topic": "Concord", "q": "Choose the correct verb: \"The committee ___ divided in their opinions.\"", "options": ["is", "was", "has", "are"], "answer": 3, "explain": "When members act as individuals, the collective noun takes a plural verb (notional concord)."},
    {"id": "GST-317", "topic": "Concord", "q": "Choose the correct verb: \"The number of students in the class ___ increasing.\"", "options": ["are", "were", "is", "have been"], "answer": 2, "explain": "\"The number\" is singular."},
    {"id": "GST-318", "topic": "Concord", "q": "Choose the correct verb: \"A number of students ___ absent yesterday.\"", "options": ["was", "is", "has", "were"], "answer": 3, "explain": "\"A number of\" means many and takes a plural verb."},
    {"id": "GST-319", "topic": "Concord", "q": "Choose the correct verb: \"Bread and butter ___ my favourite breakfast.\"", "options": ["are", "is", "were", "have"], "answer": 1, "explain": "Two nouns that form a single idea take a singular verb."},
    {"id": "GST-320", "topic": "Concord", "q": "Choose the correct verb: \"The teacher, along with his students, ___ going on an excursion.\"", "options": ["are", "were", "is", "have"], "answer": 2, "explain": "Phrases like \"along with\" do not change the number of the subject."},
    {"id": "GST-321", "topic": "Concord", "q": "Choose the correct verb: \"Ten kilometres ___ a long distance to walk.\"", "options": ["are", "were", "have", "is"], "answer": 3, "explain": "A distance treated as a single amount takes a singular verb."},
    {"id": "GST-322", "topic": "Concord", "q": "Choose the correct verb: \"Everybody ___ to be happy.\"", "options": ["wants", "want", "are wanting", "have wanted"], "answer": 0, "explain": "Everybody is singular."},
    {"id": "GST-323", "topic": "Concord", "q": "Choose the correct verb: \"One of the boys ___ sick.\"", "options": ["are", "is", "were", "have been"], "answer": 1, "explain": "The subject is \"one\", which is singular."},
    {"id": "GST-324", "topic": "Concord", "q": "Choose the correct verb: \"The police ___ arrested the thief.\"", "options": ["has", "is", "have", "was"], "answer": 2, "explain": "Police is a plural noun."},
    {"id": "GST-325", "topic": "Concord", "q": "Choose the correct verb: \"The scissors ___ on the table.\"", "options": ["is", "was", "has", "are"], "answer": 3, "explain": "Nouns that come in pairs, such as scissors and trousers, take plural verbs."},
    {"id": "GST-326", "topic": "Concord", "q": "Choose the correct verb: \"He is one of those people who ___ always late.\"", "options": ["are", "is", "was", "has been"], "answer": 0, "explain": "The relative pronoun \"who\" refers to \"those people\", which is plural."},
    {"id": "GST-327", "topic": "Concord", "q": "Choose the correct option: \"Every student must bring ___ own pen.\"", "options": ["their own's", "they", "his or her", "its"], "answer": 2, "explain": "Every student is singular, so formal grammar uses \"his or her\"."},
    {"id": "GST-328", "topic": "Concord", "q": "Choose the correct verb: \"The rich ___ not always happy.\"", "options": ["are", "is", "was", "has"], "answer": 0, "explain": "\"The\" plus an adjective refers to a group of people and takes a plural verb."},
    {"id": "GST-329", "topic": "Concord", "q": "Choose the correct verb: \"Not only the principal but also the teachers ___ present.\"", "options": ["was", "is", "were", "has"], "answer": 2, "explain": "With not only/but also, the verb agrees with the nearer subject."},
    {"id": "GST-330", "topic": "Concord", "q": "Choose the correct verb: \"There ___ many reasons for his failure.\"", "options": ["is", "was", "has", "are"], "answer": 3, "explain": "The real subject \"reasons\" is plural."},
    {"id": "GST-331", "topic": "Concord", "q": "Choose the correct verb: \"The jury ___ reached its verdict.\"", "options": ["have", "has", "are", "were"], "answer": 1, "explain": "Acting as one body, the jury takes a singular verb, matched by \"its\"."},
    {"id": "GST-332", "topic": "Concord", "q": "Choose the correct verb: \"The furniture in the rooms ___ new.\"", "options": ["are", "were", "is", "have"], "answer": 2, "explain": "Furniture is uncountable; the verb agrees with it, not with \"rooms\"."},
  ]

  questions: [
    {"id": "PHC-001", "topic": "Concept and Definitions of Health", "q": "The World Health Organization defines health as", "options": ["the absence of disease in the body", "the ability to work hard every day", "a state of complete physical, mental and social well-being and not merely the absence of disease or infirmity", "a state in which a person has never been sick"], "answer": 2, "explain": "This is the WHO definition contained in its 1948 constitution."},
    {"id": "PHC-002", "topic": "Concept and Definitions of Health", "q": "The WHO constitution, which contains the famous definition of health, came into force in", "options": ["1978", "1948", "1960", "1920"], "answer": 1, "explain": "The WHO constitution came into force on 7 April 1948."},
    {"id": "PHC-003", "topic": "Concept and Definitions of Health", "q": "World Health Day is celebrated every year on", "options": ["1 December", "31 May", "14 November", "7 April"], "answer": 3, "explain": "7 April marks the date the WHO constitution came into force."},
    {"id": "PHC-004", "topic": "Concept and Definitions of Health", "q": "A common criticism of the WHO definition of health is that", "options": ["it mentions only physical health", "it ignores mental health", "it was written by only one country", "\"complete\" well-being is idealistic and difficult to measure"], "answer": 3, "explain": "Very few people can be said to have complete well-being at all times."},
    {"id": "PHC-005", "topic": "Concept and Definitions of Health", "q": "The three dimensions of health named in the WHO definition are", "options": ["physical, spiritual and economic", "mental, political and cultural", "physical, mental and social", "social, financial and religious"], "answer": 2, "explain": "The definition mentions physical, mental and social well-being."},
    {"id": "PHC-006", "topic": "Concept and Definitions of Health", "q": "Which dimension of health is often added by later writers to those in the WHO definition?", "options": ["Financial", "Political", "Spiritual", "Mechanical"], "answer": 2, "explain": "Many scholars add spiritual health, relating to purpose, values and inner peace."},
    {"id": "PHC-007", "topic": "Concept and Definitions of Health", "q": "The sociologist who defined health as \"a state of optimum capacity of an individual for the effective performance of the roles and tasks for which he has been socialised\" was", "options": ["Talcott Parsons", "Florence Nightingale", "Halfdan Mahler", "Edward Jenner"], "answer": 0, "explain": "This functional definition was given by Talcott Parsons."},
    {"id": "PHC-008", "topic": "Concept and Definitions of Health", "q": "The health-illness continuum views health as", "options": ["a fixed state that never changes", "something only doctors can have", "a dynamic state that changes along a range from high-level wellness to death", "the same as wealth"], "answer": 2, "explain": "Health is seen as a moving point on a continuum, not as an all-or-nothing state."},
    {"id": "PHC-009", "topic": "Concept and Definitions of Health", "q": "The ecological concept of health sees health as", "options": ["the mere absence of germs", "a gift that cannot be lost", "a harmonious balance between man and his environment", "an individual's income level"], "answer": 2, "explain": "Ecologists view disease as a result of maladjustment between man and the environment."},
    {"id": "PHC-010", "topic": "Concept and Definitions of Health", "q": "The biomedical concept of health views health mainly as", "options": ["a balance between man and his spirits", "the absence of disease, with disease explained by germs and body malfunction", "the possession of wealth", "social acceptance only"], "answer": 1, "explain": "The biomedical model is based on the germ theory and focuses on the body."},
    {"id": "PHC-011", "topic": "Concept and Definitions of Health", "q": "The holistic concept of health", "options": ["considers only the organ that is diseased", "ignores the environment", "considers the whole person, including physical, mental, social and spiritual aspects", "focuses only on drugs"], "answer": 2, "explain": "Holism treats the person as a whole within their environment."},
    {"id": "PHC-012", "topic": "Concept and Definitions of Health", "q": "The psychosocial concept of health stresses that health is influenced by", "options": ["germs alone", "climate alone", "drugs alone", "social and psychological factors as well as biological ones"], "answer": 3, "explain": "It recognises the role of the mind and society in health."},
    {"id": "PHC-013", "topic": "Concept and Definitions of Health", "q": "According to WHO, mental health is a state of well-being in which a person", "options": ["never feels sad", "realises their own abilities, copes with normal stresses, works productively and contributes to the community", "has no physical illness", "lives alone"], "answer": 1, "explain": "This is WHO's description of mental health."},
    {"id": "PHC-014", "topic": "Concept and Definitions of Health", "q": "Social health refers mainly to a person's", "options": ["ability to relate well with other people and form satisfying relationships", "body weight", "blood pressure", "income level only"], "answer": 0, "explain": "Social health concerns interpersonal relationships and social roles."},
    {"id": "PHC-015", "topic": "Concept and Definitions of Health", "q": "The difference between disease and illness is that", "options": ["disease is an objective, diagnosable abnormality while illness is the person's subjective feeling of being unwell", "disease is mild while illness is severe", "illness is always infectious", "they mean exactly the same thing"], "answer": 0, "explain": "A person can feel ill without a detectable disease, and can have a disease without feeling ill."},
    {"id": "PHC-016", "topic": "Concept and Definitions of Health", "q": "In health statistics, the term \"morbidity\" refers to", "options": ["the occurrence of death in a population", "the number of births in a year", "the occurrence of disease or illness in a population", "the size of a population"], "answer": 2, "explain": "Morbidity measures how much sickness there is."},
    {"id": "PHC-017", "topic": "Concept and Definitions of Health", "q": "In health statistics, the term \"mortality\" refers to", "options": ["death or the death rate in a population", "sickness in a population", "the number of hospitals", "birth rate"], "answer": 0, "explain": "Mortality is concerned with deaths."},
    {"id": "PHC-018", "topic": "Concept and Definitions of Health", "q": "The infant mortality rate is the number of deaths of children under one year of age per", "options": ["100 pregnant women", "10,000 adults", "1,000 live births in a given year", "1,000 hospital beds"], "answer": 2, "explain": "IMR is a sensitive indicator of a community's health and living conditions."},
    {"id": "PHC-019", "topic": "Concept and Definitions of Health", "q": "Life expectancy at birth is", "options": ["the average number of years a newborn is expected to live under current mortality conditions", "the age at which most people marry", "the number of years a person spends in school", "the average age of a population"], "answer": 0, "explain": "It is a key summary indicator of population health."},
    {"id": "PHC-020", "topic": "Concept and Definitions of Health", "q": "C. E. A. Winslow defined public health as the science and art of", "options": ["treating patients in hospitals only", "preventing disease, prolonging life and promoting health through organised community efforts", "manufacturing drugs", "performing surgery"], "answer": 1, "explain": "Winslow's 1920 definition stresses organised community efforts."},
