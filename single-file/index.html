    {"id": "AUM-001", "topic": "Introduction to Pharmacology", "q": "Pharmacology is best defined as the study of", "options": ["drugs and their interactions with living systems", "plants and animals only", "the preparation of food", "the structure of the human body"], "answer": 0, "explain": "Pharmacology covers the sources, properties, actions, uses and effects of drugs."},
    {"id": "AUM-002", "topic": "Introduction to Pharmacology", "q": "The word \"pharmacology\" comes from the Greek words \"pharmakon\" and \"logos\", meaning", "options": ["drug and study", "plant and life", "body and science", "disease and cure"], "answer": 0, "explain": "Pharmakon means drug (or remedy, or poison) and logos means study or discourse."},
    {"id": "AUM-003", "topic": "Introduction to Pharmacology", "q": "According to WHO, a drug is any substance or product that is used or intended to be used to", "options": ["provide food energy only", "harm living organisms", "colour food", "modify or explore physiological systems or pathological states for the benefit of the recipient"], "answer": 3, "explain": "This is the WHO definition of a drug."},
    {"id": "AUM-004", "topic": "Introduction to Pharmacology", "q": "The scientist often called the father of modern pharmacology is", "options": ["Oswald Schmiedeberg", "Hippocrates", "Alexander Fleming", "Louis Pasteur"], "answer": 0, "explain": "Schmiedeberg trained many pharmacologists and founded modern experimental pharmacology."},
    {"id": "AUM-005", "topic": "Introduction to Pharmacology", "q": "The person who established the first institute of pharmacology, at Dorpat, was", "options": ["Rudolf Buchheim", "Paracelsus", "Edward Jenner", "Joseph Lister"], "answer": 0, "explain": "Buchheim established the first pharmacological institute in the 19th century."},
    {"id": "AUM-006", "topic": "Introduction to Pharmacology", "q": "\"All things are poison and nothing is without poison; only the dose makes a thing not a poison.\" This statement is credited to", "options": ["Hippocrates", "Galen", "Paracelsus", "Schmiedeberg"], "answer": 2, "explain": "Paracelsus emphasised the role of dose in toxicity."},
    {"id": "AUM-007", "topic": "Introduction to Pharmacology", "q": "The two major branches of pharmacology are", "options": ["pharmacy and nursing", "anatomy and physiology", "pharmacokinetics and pharmacodynamics", "toxicology and surgery"], "answer": 2, "explain": "Pharmacokinetics deals with drug movement, pharmacodynamics with drug effects."},
    {"id": "AUM-008", "topic": "Introduction to Pharmacology", "q": "Pharmacokinetics is best described as", "options": ["what the drug does to the body", "the study of drug prices", "what the body does to the drug", "the study of plant sources only"], "answer": 2, "explain": "It covers absorption, distribution, metabolism and excretion."},
    {"id": "AUM-009", "topic": "Introduction to Pharmacology", "q": "Pharmacodynamics is best described as", "options": ["what the body does to the drug", "the manufacture of drugs", "what the drug does to the body", "the sale of drugs"], "answer": 2, "explain": "It covers mechanisms of action and effects."},
    {"id": "AUM-010", "topic": "Introduction to Pharmacology", "q": "Pharmacotherapeutics is the branch of pharmacology that deals with", "options": ["the poisonous effects of chemicals", "drug manufacture", "plant identification", "the use of drugs in the prevention and treatment of disease"], "answer": 3, "explain": "It applies pharmacology to patient care."},
    {"id": "AUM-011", "topic": "Introduction to Pharmacology", "q": "Toxicology is the study of", "options": ["the therapeutic use of drugs only", "drug prices", "drug names", "the harmful effects of drugs and other chemicals"], "answer": 3, "explain": "Toxicology also covers the detection and treatment of poisoning."},
    {"id": "AUM-012", "topic": "Introduction to Pharmacology", "q": "The art and science of preparing, compounding and dispensing drugs is", "options": ["pharmacy", "pharmacodynamics", "toxicology", "posology"], "answer": 0, "explain": "Pharmacy is the profession that prepares and supplies medicines."},
    {"id": "AUM-013", "topic": "Introduction to Pharmacology", "q": "The study of drugs obtained from natural sources such as plants and animals is", "options": ["pharmacogenetics", "posology", "pharmacognosy", "toxicology"], "answer": 2, "explain": "Pharmacognosy deals with crude drugs of natural origin."},
    {"id": "AUM-014", "topic": "Introduction to Pharmacology", "q": "The study of how a person's genetic make-up affects their response to drugs is", "options": ["pharmacognosy", "pharmacogenetics", "pharmacoepidemiology", "posology"], "answer": 1, "explain": "Genetic differences can cause unusual drug responses."},
    {"id": "AUM-015", "topic": "Introduction to Pharmacology", "q": "The study of the use and effects of drugs in large populations is", "options": ["pharmacoepidemiology", "pharmacognosy", "pharmacy", "posology"], "answer": 0, "explain": "It combines pharmacology with epidemiology."},
    {"id": "AUM-016", "topic": "Introduction to Pharmacology", "q": "The science of detecting, assessing, understanding and preventing adverse effects of medicines is", "options": ["pharmacovigilance", "pharmacognosy", "posology", "pharmaceutics"], "answer": 0, "explain": "Pharmacovigilance monitors drug safety after marketing."},
    {"id": "AUM-017", "topic": "Introduction to Pharmacology", "q": "Posology is the branch of pharmacology that deals with", "options": ["poisons only", "drug sources", "dosage of drugs", "drug names"], "answer": 2, "explain": "Posology comes from the Greek \"posos\", meaning how much."},
    {"id": "AUM-018", "topic": "Introduction to Pharmacology", "q": "The branch of pharmacy that deals with the formulation of drugs into suitable dosage forms is", "options": ["pharmaceutics", "pharmacodynamics", "toxicology", "pharmacovigilance"], "answer": 0, "explain": "Pharmaceutics turns active substances into tablets, syrups, injections and so on."},
    {"id": "AUM-019", "topic": "Introduction to Pharmacology", "q": "The use of drugs to kill or inhibit invading microorganisms, parasites or cancer cells is called", "options": ["physiotherapy", "psychotherapy", "radiotherapy", "chemotherapy"], "answer": 3, "explain": "Chemotherapy targets the invader more than the host."},
    {"id": "AUM-020", "topic": "Introduction to Pharmacology", "q": "Morphine is obtained from the", "options": ["foxglove plant", "cinchona tree", "opium poppy", "willow tree"], "answer": 2, "explain": "Morphine is the main alkaloid of opium from Papaver somniferum."},
    {"id": "AUM-021", "topic": "Introduction to Pharmacology", "q": "Digoxin is obtained from the", "options": ["foxglove (Digitalis) plant", "opium poppy", "cinchona bark", "Penicillium mould"], "answer": 0, "explain": "Digitalis glycosides are used in heart failure and atrial fibrillation."},
    {"id": "AUM-022", "topic": "Introduction to Pharmacology", "q": "Quinine is obtained from the bark of the", "options": ["cinchona tree", "willow tree", "neem tree", "mango tree"], "answer": 0, "explain": "Quinine was one of the earliest antimalarial drugs."},
    {"id": "AUM-023", "topic": "Introduction to Pharmacology", "q": "Penicillin, discovered by Alexander Fleming in 1928, is obtained from", "options": ["a mineral", "a mould (Penicillium)", "the opium poppy", "the pancreas of pigs"], "answer": 1, "explain": "It is an example of a drug from a microorganism."},
    {"id": "AUM-024", "topic": "Introduction to Pharmacology", "q": "Magnesium sulphate and ferrous sulphate are examples of drugs obtained from", "options": ["animal sources", "plant sources", "microorganisms", "mineral sources"], "answer": 3, "explain": "Minerals provide several inorganic drugs."},
    {"id": "AUM-025", "topic": "Introduction to Pharmacology", "q": "Human insulin is now mainly produced by", "options": ["recombinant DNA technology (genetic engineering)", "extraction from plants", "mining", "fermentation of grapes"], "answer": 0, "explain": "Bacteria or yeast are engineered to make human insulin."},
    {"id": "AUM-026", "topic": "Introduction to Pharmacology", "q": "Before recombinant technology, insulin was obtained mainly from", "options": ["the liver of sheep", "the pancreas of pigs and cattle", "plants", "minerals"], "answer": 1, "explain": "Insulin is a hormone made by pancreatic beta cells."},
    {"id": "AUM-027", "topic": "Introduction to Pharmacology", "q": "Artemisinin, used to make modern antimalarial drugs, is obtained from", "options": ["cinchona bark", "Artemisia annua (sweet wormwood)", "foxglove", "the opium poppy"], "answer": 1, "explain": "Artemisinin was discovered by Tu Youyou, who won the Nobel Prize in 2015."},
    {"id": "AUM-028", "topic": "Introduction to Pharmacology", "q": "Atropine is obtained from", "options": ["Atropa belladonna (deadly nightshade)", "the opium poppy", "the foxglove plant", "cinchona bark"], "answer": 0, "explain": "Atropine is an anticholinergic alkaloid."},
    {"id": "AUM-029", "topic": "Introduction to Pharmacology", "q": "Aspirin was developed from salicin, a compound originally found in", "options": ["foxglove", "the opium poppy", "willow bark", "cinchona bark"], "answer": 2, "explain": "Willow bark was used for pain and fever long before aspirin."},
    {"id": "AUM-030", "topic": "Introduction to Pharmacology", "q": "Reserpine, an old antihypertensive drug, is obtained from", "options": ["Atropa belladonna", "Rauwolfia serpentina", "Digitalis purpurea", "Papaver somniferum"], "answer": 1, "explain": "Rauwolfia is also called Indian snakeroot."},
    {"id": "AUM-031", "topic": "Introduction to Pharmacology", "q": "A pharmacopoeia is", "options": ["a type of hospital", "a drug manufacturing company", "an official book that sets standards for drugs and their preparations", "a list of diseases"], "answer": 2, "explain": "Examples include the British Pharmacopoeia and the United States Pharmacopeia."},
    {"id": "AUM-032", "topic": "Introduction to Pharmacology", "q": "The agency that regulates the manufacture, importation, sale and use of drugs in Nigeria is", "options": ["NAFDAC", "NPHCDA", "NHIA", "WHO"], "answer": 0, "explain": "The National Agency for Food and Drug Administration and Control regulates drugs."},
    {"id": "AUM-033", "topic": "Introduction to Pharmacology", "q": "The body that regulates the practice of pharmacy in Nigeria is the", "options": ["Pharmacists Council of Nigeria", "Nigerian Medical Association", "Nursing and Midwifery Council", "National Universities Commission"], "answer": 0, "explain": "PCN registers pharmacists and pharmacy premises."},
    {"id": "AUM-034", "topic": "Introduction to Pharmacology", "q": "Phase I clinical trials of a new drug are usually carried out on", "options": ["thousands of patients", "a small number of healthy volunteers", "animals only", "the general population after marketing"], "answer": 1, "explain": "Phase I mainly tests safety and pharmacokinetics."},
    {"id": "AUM-035", "topic": "Introduction to Pharmacology", "q": "Phase III clinical trials are carried out to", "options": ["confirm effectiveness and monitor side effects in a large number of patients", "test the drug on animals", "test the drug in test tubes", "study the drug after marketing"], "answer": 0, "explain": "Phase III gives the main evidence for approval."},
    {"id": "AUM-036", "topic": "Introduction to Pharmacology", "q": "Phase IV of drug development refers to", "options": ["animal testing", "first use in humans", "laboratory synthesis", "post-marketing surveillance"], "answer": 3, "explain": "Phase IV monitors drugs after they are approved and sold."},
    {"id": "AUM-037", "topic": "Introduction to Pharmacology", "q": "Testing a new drug in laboratory animals before giving it to humans is called", "options": ["phase III trial", "phase IV surveillance", "preclinical testing", "clinical audit"], "answer": 2, "explain": "Preclinical studies assess safety and activity."},
    {"id": "AUM-038", "topic": "Introduction to Pharmacology", "q": "A placebo is", "options": ["a very strong drug", "an inactive substance given in place of a drug, often as a control in trials", "a type of vaccine", "a drug used only in surgery"], "answer": 1, "explain": "Placebos help to separate true drug effects from expectation effects."},
    {"id": "AUM-039", "topic": "Introduction to Pharmacology", "q": "In a double-blind clinical trial", "options": ["neither the patients nor the investigators know who receives the drug or placebo", "only the patients know their treatment", "everyone knows who receives the drug", "no placebo is used"], "answer": 0, "explain": "Double blinding reduces bias."},
    {"id": "AUM-040", "topic": "Introduction to Pharmacology", "q": "Drugs obtained from animals include", "options": ["morphine and quinine", "iron and magnesium", "penicillin and streptomycin", "insulin and heparin"], "answer": 3, "explain": "Heparin was traditionally extracted from pig intestine or cattle lung."},
    {"id": "AUM-041", "topic": "Introduction to Pharmacology", "q": "Drugs made entirely by chemical processes in the laboratory are described as", "options": ["natural drugs", "mineral drugs", "crude drugs", "synthetic drugs"], "answer": 3, "explain": "Many modern drugs, such as paracetamol, are synthetic."},
    {"id": "AUM-042", "topic": "Basic Terminologies in Pharmacology", "q": "A dose is the", "options": ["total number of tablets in a pack", "time a drug takes to act", "price of a drug", "quantity of a drug administered at one time"], "answer": 3, "explain": "Dose refers to the amount given at once."},
    {"id": "AUM-043", "topic": "Basic Terminologies in Pharmacology", "q": "A loading dose is", "options": ["the smallest dose of a drug", "a dose given only at night", "a larger initial dose given to achieve therapeutic levels quickly", "the dose that kills 50% of animals"], "answer": 2, "explain": "Loading doses are used for drugs with long half-lives."},
    {"id": "AUM-044", "topic": "Basic Terminologies in Pharmacology", "q": "A maintenance dose is the dose", "options": ["given once to start treatment", "that causes toxicity", "given regularly to keep the drug concentration at a steady therapeutic level", "given only in emergencies"], "answer": 2, "explain": "It replaces the amount of drug eliminated."},
    {"id": "AUM-045", "topic": "Basic Terminologies in Pharmacology", "q": "The therapeutic index of a drug is the ratio of", "options": ["the effective dose to the toxic dose", "the price to the dose", "the dose to body weight", "the toxic (or lethal) dose to the effective dose"], "answer": 3, "explain": "A high therapeutic index means a wider margin of safety."},
    {"id": "AUM-046", "topic": "Basic Terminologies in Pharmacology", "q": "Which of the following drugs has a narrow therapeutic index?", "options": ["Digoxin", "Penicillin", "Vitamin C", "Paracetamol at normal doses"], "answer": 0, "explain": "Small changes in digoxin levels can cause toxicity."},
    {"id": "AUM-047", "topic": "Basic Terminologies in Pharmacology", "q": "ED50 is the dose of a drug that", "options": ["produces the desired effect in 50% of the population", "kills 50% of the population", "is excreted in 50% of the time", "is 50 mg"], "answer": 0, "explain": "ED stands for effective dose."},
    {"id": "AUM-048", "topic": "Basic Terminologies in Pharmacology", "q": "LD50 is the dose of a drug that", "options": ["kills 50% of the test animals", "is effective in 50% of patients", "is half of the normal dose", "is given every 50 minutes"], "answer": 0, "explain": "LD stands for lethal dose."},
    {"id": "AUM-049", "topic": "Basic Terminologies in Pharmacology", "q": "A side effect is", "options": ["the main desired effect of a drug", "an effect seen only in overdose", "an unwanted but often predictable effect of a drug at a normal therapeutic dose", "an effect on another person"], "answer": 2, "explain": "Example: drowsiness with some antihistamines."},
    {"id": "AUM-050", "topic": "Basic Terminologies in Pharmacology", "q": "An adverse drug reaction is", "options": ["the desired effect of a drug", "the effect of a placebo", "a harmful and unintended response to a drug at normal doses", "a reaction only in animals"], "answer": 2, "explain": "WHO defines ADRs as noxious and unintended responses."},
    {"id": "AUM-051", "topic": "Basic Terminologies in Pharmacology", "q": "Idiosyncrasy is", "options": ["a genetically determined abnormal reaction to a drug", "an allergic reaction", "an expected side effect", "tolerance"], "answer": 0, "explain": "Example: haemolysis with primaquine in G6PD deficiency."},
    {"id": "AUM-052", "topic": "Basic Terminologies in Pharmacology", "q": "Drug allergy (hypersensitivity) is", "options": ["a reaction due only to overdose", "a genetically determined enzyme defect", "tolerance to a drug", "an immune-mediated reaction to a drug"], "answer": 3, "explain": "The immune system reacts to the drug as a foreign substance."},
    {"id": "AUM-053", "topic": "Basic Terminologies in Pharmacology", "q": "Anaphylaxis is", "options": ["a severe, life-threatening hypersensitivity reaction", "a mild side effect", "tolerance to a drug", "the desired effect of a drug"], "answer": 0, "explain": "The first-line treatment is intramuscular adrenaline."},
    {"id": "AUM-054", "topic": "Basic Terminologies in Pharmacology", "q": "Tolerance is", "options": ["increased response to a drug", "an allergic reaction", "reduced response to a drug after repeated use, so a larger dose is needed for the same effect", "a genetically abnormal response"], "answer": 2, "explain": "Tolerance develops to drugs such as opioids."},
    {"id": "AUM-055", "topic": "Basic Terminologies in Pharmacology", "q": "Tachyphylaxis is", "options": ["a rapid decrease in response after only a few doses", "slow development of tolerance over years", "an allergic reaction", "an overdose"], "answer": 0, "explain": "Ephedrine shows tachyphylaxis."},
    {"id": "AUM-056", "topic": "Basic Terminologies in Pharmacology", "q": "Physical dependence on a drug is shown by", "options": ["improved health after stopping", "withdrawal symptoms when the drug is stopped", "allergic rashes", "increased appetite only"], "answer": 1, "explain": "The body adapts to the drug's presence."},
    {"id": "AUM-057", "topic": "Basic Terminologies in Pharmacology", "q": "A teratogen is a drug or agent that", "options": ["causes cancer", "kills bacteria", "causes malformations in a developing fetus", "causes tolerance"], "answer": 2, "explain": "Teratogens act mainly in the first trimester."},
    {"id": "AUM-058", "topic": "Basic Terminologies in Pharmacology", "q": "The thalidomide disaster of the early 1960s caused babies to be born with", "options": ["cleft lip only", "Down syndrome", "sickle cell disease", "phocomelia (severe limb defects)"], "answer": 3, "explain": "Thalidomide was given to pregnant women for morning sickness."},
    {"id": "AUM-059", "topic": "Basic Terminologies in Pharmacology", "q": "An indication is", "options": ["a situation where a drug must not be used", "a side effect", "the price of a drug", "a condition for which a drug is used"], "answer": 3, "explain": "Example: malaria is an indication for artemether-lumefantrine."},
    {"id": "AUM-060", "topic": "Basic Terminologies in Pharmacology", "q": "A contraindication is", "options": ["a condition for which a drug is used", "the dose of a drug", "a condition in which a drug should not be used", "the name of a drug"], "answer": 2, "explain": "Using a drug when contraindicated can cause harm."},
    {"id": "AUM-061", "topic": "Basic Terminologies in Pharmacology", "q": "Synergism occurs when", "options": ["two drugs cancel each other", "one drug has no effect", "the effect equals one drug alone", "the combined effect of two drugs is greater than the sum of their individual effects"], "answer": 3, "explain": "Example: trimethoprim with sulfamethoxazole."},
    {"id": "AUM-062", "topic": "Basic Terminologies in Pharmacology", "q": "An additive effect occurs when", "options": ["the combined effect of two drugs equals the sum of their individual effects", "the combined effect is less than either drug alone", "one drug blocks the other", "neither drug has an effect"], "answer": 0, "explain": "1 + 1 = 2."},
    {"id": "AUM-063", "topic": "Basic Terminologies in Pharmacology", "q": "Potentiation occurs when", "options": ["a drug that has no effect on its own enhances the effect of another drug", "two drugs cancel each other", "a drug becomes less effective over time", "a drug causes allergy"], "answer": 0, "explain": "Example: probenecid enhances penicillin levels."},
    {"id": "AUM-064", "topic": "Basic Terminologies in Pharmacology", "q": "Drug antagonism occurs when", "options": ["two drugs add their effects", "one drug reduces or blocks the effect of another", "a drug has no side effects", "a drug is given by injection"], "answer": 1, "explain": "Example: naloxone reverses the effects of morphine."},
    {"id": "AUM-065", "topic": "Basic Terminologies in Pharmacology", "q": "A prodrug is", "options": ["a drug that is very potent", "a drug used before surgery", "a placebo", "an inactive compound that is converted to an active drug in the body"], "answer": 3, "explain": "Examples are levodopa and enalapril."},
    {"id": "AUM-066", "topic": "Basic Terminologies in Pharmacology", "q": "Bioavailability is", "options": ["the fraction of an administered dose that reaches the systemic circulation unchanged", "the speed at which a drug is excreted", "the cost of a drug", "the colour of a drug"], "answer": 0, "explain": "It is 100% for intravenous drugs."},
    {"id": "AUM-067", "topic": "Basic Terminologies in Pharmacology", "q": "The plasma half-life of a drug is the time taken for", "options": ["the drug to be absorbed completely", "the drug to start acting", "the plasma concentration of the drug to fall by half", "the tablet to dissolve"], "answer": 2, "explain": "Half-life helps decide dosing frequency."},
    {"id": "AUM-068", "topic": "Basic Terminologies in Pharmacology", "q": "With regular dosing, steady state plasma concentration is reached after about", "options": ["1 half-life", "20 half-lives", "4 to 5 half-lives", "1 hour regardless of the drug"], "answer": 2, "explain": "At steady state, the rate of intake equals the rate of elimination."},
    {"id": "AUM-069", "topic": "Basic Terminologies in Pharmacology", "q": "Efficacy of a drug refers to", "options": ["the maximum effect it can produce", "the amount needed to produce an effect", "its price", "its colour"], "answer": 0, "explain": "A drug with greater efficacy produces a bigger maximum response."},
    {"id": "AUM-070", "topic": "Basic Terminologies in Pharmacology", "q": "Potency of a drug refers to", "options": ["the maximum effect it can produce", "the duration of action", "its taste", "the amount of drug needed to produce a given effect"], "answer": 3, "explain": "A more potent drug works at a lower dose."},
    {"id": "AUM-071", "topic": "Basic Terminologies in Pharmacology", "q": "An iatrogenic disease is", "options": ["a hereditary disease", "a disease caused by poor diet", "a disease caused by medical treatment or drugs", "an infectious disease"], "answer": 2, "explain": "Example: drug-induced Cushing's syndrome from long-term steroids."},
    {"id": "AUM-072", "topic": "Basic Terminologies in Pharmacology", "q": "A drug interaction occurs when", "options": ["a drug is taken alone", "a drug is stored properly", "a drug is prescribed by name", "the effect of one drug is changed by another drug, food or drink"], "answer": 3, "explain": "Interactions can increase or decrease effects."},
    {"id": "AUM-073", "topic": "Basic Terminologies in Pharmacology", "q": "Over-the-counter (OTC) drugs are drugs that", "options": ["can only be given in hospitals", "can be bought without a doctor's prescription", "are illegal", "are only for animals"], "answer": 1, "explain": "Examples include some analgesics and antacids."},
    {"id": "AUM-074", "topic": "Basic Terminologies in Pharmacology", "q": "Controlled drugs are", "options": ["drugs sold freely in markets", "drugs with abuse potential whose use is strictly regulated by law", "herbal products only", "vitamins"], "answer": 1, "explain": "Morphine and pethidine are examples."},
    {"id": "AUM-075", "topic": "Basic Terminologies in Pharmacology", "q": "A dosage form is", "options": ["the amount of drug in the body", "the name of the drug", "the physical form in which a drug is given, such as a tablet, capsule or injection", "the time the drug acts"], "answer": 2, "explain": "Dosage forms make drugs convenient and effective."},
    {"id": "AUM-076", "topic": "Basic Terminologies in Pharmacology", "q": "An enteric-coated tablet is designed to", "options": ["pass through the stomach and dissolve in the intestine", "dissolve in the mouth", "dissolve in the stomach immediately", "be injected"], "answer": 0, "explain": "Enteric coating protects the drug or the stomach."},
    {"id": "AUM-077", "topic": "Basic Terminologies in Pharmacology", "q": "A sustained-release preparation is designed to", "options": ["release the whole drug immediately", "release the drug slowly over a long period", "be used only once in a lifetime", "be applied to the skin only"], "answer": 1, "explain": "It reduces dosing frequency."},
    {"id": "AUM-078", "topic": "Basic Terminologies in Pharmacology", "q": "The therapeutic window is the range of plasma concentration between", "options": ["the minimum effective concentration and the minimum toxic concentration", "zero and the maximum concentration", "the dose and the half-life", "absorption and excretion"], "answer": 0, "explain": "Drug levels should stay within this window."},
    {"id": "AUM-079", "topic": "Basic Terminologies in Pharmacology", "q": "Cumulation of a drug occurs when", "options": ["the drug is excreted too quickly", "the drug is given faster than it is eliminated, so it builds up in the body", "the drug is not absorbed", "the drug is stored in a fridge"], "answer": 1, "explain": "Cumulation can lead to toxicity."},
    {"id": "AUM-080", "topic": "Basic Terminologies in Pharmacology", "q": "Drug abuse is", "options": ["the use of a drug in a way that is not medically approved", "the correct use of drugs", "the storage of drugs", "the prescription of drugs"], "answer": 0, "explain": "Examples include non-medical use of codeine or tramadol."},
    {"id": "AUM-081", "topic": "Basic Terminologies in Pharmacology", "q": "A carcinogen is a substance that", "options": ["kills bacteria", "relieves pain", "can cause cancer", "reduces fever"], "answer": 2, "explain": "Some drugs and chemicals are carcinogenic."},
    {"id": "AUM-082", "topic": "Basic Terminologies in Pharmacology", "q": "Polypharmacy refers to", "options": ["the study of many plants", "the use of one drug only", "the sale of drugs in pharmacies", "the use of many drugs at the same time by one patient"], "answer": 3, "explain": "Polypharmacy increases the risk of interactions."},
    {"id": "AUM-083", "topic": "Basic Terminologies in Pharmacology", "q": "Adherence (compliance) refers to", "options": ["the amount of drug absorbed", "the extent to which a patient takes medicines as prescribed", "the dose of a drug", "the cost of treatment"], "answer": 1, "explain": "Poor adherence leads to treatment failure."},
    {"id": "AUM-084", "topic": "Basic Terminologies in Pharmacology", "q": "Prophylaxis refers to", "options": ["the use of a drug to treat existing disease", "drug abuse", "the use of a drug to prevent disease", "drug storage"], "answer": 2, "explain": "Example: malaria prevention with sulfadoxine-pyrimethamine in pregnancy."},
    {"id": "AUM-085", "topic": "Basic Terminologies in Pharmacology", "q": "Empirical therapy means", "options": ["treating after all tests are complete", "giving a placebo", "starting treatment based on the most likely cause before a definite diagnosis is confirmed", "stopping all drugs"], "answer": 2, "explain": "Antibiotics are often started empirically in severe infections."},
    {"id": "AUM-086", "topic": "Basic Terminologies in Pharmacology", "q": "A toxic effect of a drug is", "options": ["the intended therapeutic effect", "an effect caused by an excessive dose or excessive accumulation of the drug", "an effect of a placebo", "a genetically determined reaction only"], "answer": 1, "explain": "Toxicity is usually dose-related."},
    {"id": "AUM-087", "topic": "Importance of Pharmacology", "q": "The main importance of pharmacology to health workers is that it helps them to", "options": ["sell more drugs", "avoid all drug use", "use drugs safely and effectively", "diagnose diseases without examination"], "answer": 2, "explain": "Knowledge of drugs protects patients."},

    {"id": "AUM-181", "topic": "Pharmacodynamics", "q": "A competitive antagonist", "options": ["shifts the agonist dose-response curve to the right without reducing the maximal response", "reduces the maximal response that cannot be overcome", "has no effect on the agonist", "produces a full response itself"], "answer": 0, "explain": "Its effect can be overcome by increasing the agonist dose."},

  <script>/* js/engine.js */
/*
 * Exam engine: picks questions, shuffles them and marks scripts.
 * Pure functions with no Firebase or page code, so they can be tested in Node.
 */
(function (root) {
  'use strict';

  /* Random integer 0..n-1 using the best randomness available. */
  function randInt(n) {
    var c = root.crypto || (typeof globalThis !== 'undefined' && globalThis.crypto);
    if (c && c.getRandomValues) {
      var buf = new Uint32Array(1);
      var limit = Math.floor(0x100000000 / n) * n;
      do { c.getRandomValues(buf); } while (buf[0] >= limit);
      return buf[0] % n;
    }
    return Math.floor(Math.random() * n);
  }

  /* Fisher-Yates shuffle (returns a new array). */
  function shuffle(arr, rng) {
    var a = arr.slice();
    var r = rng || randInt;
    for (var i = a.length - 1; i > 0; i--) {
      var j = r(i + 1);
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* Pick n questions from pool, spread as evenly as possible across topics:
   * shuffle each topic, then take one question from each topic in turn. */
  function balancedPick(pool, n, rng) {
    var groups = {};
    pool.forEach(function (q) { (groups[q.topic] = groups[q.topic] || []).push(q); });
    var topics = shuffle(Object.keys(groups), rng);
    topics.forEach(function (t) { groups[t] = shuffle(groups[t], rng); });
    var out = [];
    var round = 0;
    while (out.length < n) {
      var added = false;
      for (var k = 0; k < topics.length && out.length < n; k++) {
        var g = groups[topics[k]];
        if (round < g.length) { out.push(g[round]); added = true; }
      }
      if (!added) break;
      round++;
    }
    return out;
  }

  /*
   * Choose the questions for one course.
   *  bank:  array of questions { id, topic, ... }
   *  seen:  { cycle: number, ids: [questionIds already seen in this cycle] }
   *  count: how many to pick
   * Returns { questions, seen: newSeen, reset: bool }
   * Rules: never repeat a seen question until the whole bank has been seen,
   * then start a new cycle. Never the same question twice in one exam.
   */
  function pickForCourse(bank, seen, count, rng) {
    var valid = {};
    bank.forEach(function (q) { valid[q.id] = true; });
    var cycle = (seen && seen.cycle) || 0;
    var seenIds = ((seen && seen.ids) || []).filter(function (id) { return valid[id]; });
    var seenSet = {};
    seenIds.forEach(function (id) { seenSet[id] = true; });
    count = Math.min(count, bank.length);

    var unseen = bank.filter(function (q) { return !seenSet[q.id]; });
    if (unseen.length >= count) {
      var picked = balancedPick(unseen, count, rng);
      return {
        questions: shuffle(picked, rng),
        seen: { cycle: cycle, ids: seenIds.concat(picked.map(function (q) { return q.id; })) },
        reset: false
      };
    }
    // Not enough unseen questions left: use all of them, then start a new cycle
    // and top up from the rest of the bank (excluding the ones just used).
    var takenSet = {};
    unseen.forEach(function (q) { takenSet[q.id] = true; });
    var rest = bank.filter(function (q) { return !takenSet[q.id]; });
    var extra = balancedPick(rest, count - unseen.length, rng);
    return {
      questions: shuffle(unseen.concat(extra), rng),
      seen: { cycle: cycle + 1, ids: extra.map(function (q) { return q.id; }) },
      reset: true
    };
  }

  /* Build a full exam. banks: { CODE: [questions] }, seenAll: { CODE: seen } */
  function buildExam(courses, banks, seenAll, perCourse, rng) {
    var sections = [];
    var newSeen = {};
    courses.forEach(function (c) {
      var bank = banks[c.code] || [];
      var res = pickForCourse(bank, (seenAll || {})[c.code], perCourse, rng);
      newSeen[c.code] = res.seen;
      sections.push({
        code: c.code,
        items: res.questions.map(function (q) {
          return { id: q.id, perm: shuffle([0, 1, 2, 3], rng) }; // perm[displayIndex] = original option index
        })
      });
    });
    return { sections: sections, seen: newSeen };
  }

  /* Mark an exam. answers: { CODE: { itemIndex: displayIndex } } */
  function markExam(sections, answers, lookup) {
    var perCourse = {};
    var score = 0, total = 0;
    sections.forEach(function (s) {
      var a = (answers && answers[s.code]) || {};
      var c = 0, wrong = 0, skipped = 0;
      s.items.forEach(function (it, i) {
        var q = lookup(it.id);
        var chosen = a[i];
        if (chosen === undefined || chosen === null) { skipped++; return; }
        if (q && it.perm[chosen] === q.answer) c++; else wrong++;
      });
      perCourse[s.code] = { score: c, total: s.items.length, wrong: wrong, skipped: skipped };
      score += c; total += s.items.length;
    });
    var pct = total ? Math.round((score / total) * 1000) / 10 : 0;
    return { score: score, total: total, pct: pct, perCourse: perCourse };
  }

  /* Merge two seen records (e.g. Firestore and local backup): the higher
   * cycle wins; within the same cycle the ID lists are combined. */
  function mergeSeen(a, b) {
    var out = {};
    var keys = {};
    Object.keys(a || {}).forEach(function (k) { keys[k] = true; });
    Object.keys(b || {}).forEach(function (k) { keys[k] = true; });
    Object.keys(keys).forEach(function (k) {
      var x = (a || {})[k], y = (b || {})[k];
      if (!x) { out[k] = y; return; }
      if (!y) { out[k] = x; return; }
      var cx = x.cycle || 0, cy = y.cycle || 0;
      if (cx > cy) out[k] = x;
      else if (cy > cx) out[k] = y;
      else {
        var set = {}, ids = [];
        (x.ids || []).concat(y.ids || []).forEach(function (id) { if (!set[id]) { set[id] = true; ids.push(id); } });
        out[k] = { cycle: cx, ids: ids };
      }
    });
    return out;
  }

  var api = {
    shuffle: shuffle,
    balancedPick: balancedPick,
    pickForCourse: pickForCourse,
    buildExam: buildExam,
    markExam: markExam,
    mergeSeen: mergeSeen
  };
  root.CBTEngine = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

/*
 * Data store.
 *  - FIREBASE MODE (when js/config.js has Firebase keys): everything is saved
 *    in Firestore and shared by every phone. The leaderboard is live.
 *  - DEMO MODE (no keys yet): everything is saved in this browser only.
 * Both modes expose exactly the same functions to app.js.
 *
 * Firestore layout
 *   students/{sid}            name, matric, hasPin, attempts, bestPct, bestScore,
 *                             bestTotal, bestAt, lastPct, lastExamId, createdAt, updatedAt
 *   students/{sid}/pin/{hash} exists only if the student chose a PIN (hash of matric + PIN)
 *   seen/{sid}                courses: { GST: { cycle, ids: [...] }, ... }, updatedAt
 *   attempts/{sid}_{n}        one record per submitted exam
 * sid = matric number in capitals with any symbol replaced by "_" (UG/23/001 -> UG_23_001)
 */
(function () {
  'use strict';
  var CFG = window.CBT_CONFIG || {};
  var E = window.CBTEngine;
  var FIREBASE_VERSION = '10.12.2';
  var NET_TIMEOUT_MS = 20000;

  /* ---------- small helpers ---------- */
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  };
  function normMatric(m) { return String(m || '').toUpperCase().replace(/\s+/g, ''); }
  function sidOf(m) { return normMatric(m).replace(/[^A-Z0-9]/g, '_'); }
  function err(code, message) { var e = new Error(message || code); e.code = code; return e; }

  // cyrb53 string hash (two seeds = 106 bits). Same result on every device.
  function cyrb53(str, seed) {
    var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (var i = 0, ch; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
  }
  function pinHash(sid, pin) {
    var s = sid + ':' + pin + ':cbt-pin-v1';
    return cyrb53(s, 7) + cyrb53(s, 1931);
  }
  function withTimeout(p, ms) {
    return new Promise(function (resolve, reject) {
      var t = setTimeout(function () { reject(err('timeout', 'The network is too slow.')); }, ms || NET_TIMEOUT_MS);

    });
  }
  function sortBoard(list) {
    return list
      .filter(function (s) { return (s.attempts || 0) > 0; })
      .sort(function (a, b) { return (b.bestPct - a.bestPct) || ((a.bestAt || 0) - (b.bestAt || 0)) || a.name.localeCompare(b.name); });
  }
  function localSeenKey(sid) { return 'cbt_seen_' + sid; }

  /* =====================================================================
   * DEMO STORE (localStorage only)
   * ===================================================================== */
  var DEMO_KEY = 'cbt_demo_db_v1';
  function demoDb() { return LS.get(DEMO_KEY, null) || { students: {}, seen: {}, attempts: {}, pins: {} }; }
  function demoSave(db) {
    LS.set(DEMO_KEY, db);
    try { window.dispatchEvent(new Event('cbt-demo-change')); } catch (e) { /* ignore */ }
  }
  function delay(v) { return new Promise(function (r) { setTimeout(function () { r(v); }, 250); }); }

  var DemoStore = {
    mode: 'demo',
    init: function () { return Promise.resolve(); },
    sidOf: sidOf,
    normMatric: normMatric,

    getStudent: function (matric) {

      return delay(s ? Object.assign({}, s) : null);
    },
    getStudentBySid: function (sid) {

    saveSeen: function (sid, courses) {

    submitAttempt: function (sid, r) {

      if (improved) { s.bestPct = r.pct; s.bestScore = r.score; s.bestTotal = r.total; s.bestAt = Date.now(); }

        cb(sortBoard(all).slice(0, CFG.leaderboardSize || 100));

      window.addEventListener('storage', onStorage);

    },
    getRank: function (student) {
      var db = demoDb();
      var board = sortBoard(Object.keys(db.students).map(function (k) { return db.students[k]; }));

  /* =====================================================================
   * FIREBASE STORE (Cloud Firestore)
   * ===================================================================== */
  var fs = null, db = null, initPromise = null;
  function toStudent(id, d) {
    if (!d) return null;
    var ts = function (v) { return v && typeof v.toMillis === 'function' ? v.toMillis() : (typeof v === 'number' ? v : Date.now()); };
    return {
      sid: id, name: d.name, matric: d.matric, hasPin: !!d.hasPin,
      attempts: d.attempts || 0, bestPct: d.bestPct || 0, bestScore: d.bestScore || 0, bestTotal: d.bestTotal || 0,
      bestAt: ts(d.bestAt), lastPct: d.lastPct || 0, lastExamId: d.lastExamId || '', createdAt: ts(d.createdAt)
    };
  }
  function mapFbError(e) {
    if (e && e.code && /^(exists|not-found|timeout|wrong-pin)$/.test(e.code)) return e;
    var c = (e && e.code) || '';
    if (c === 'permission-denied') return err('permission', e.message);
    if (c === 'unavailable' || c === 'deadline-exceeded' || /offline|network/i.test((e && e.message) || '')) return err('network', e && e.message);
    if (c === 'failed-precondition' && /index/i.test((e && e.message) || '')) return err('index', e.message);
    return err('unknown', e && e.message);
  }

  var FirebaseStore = {
    mode: 'firebase',
    sidOf: sidOf,
    normMatric: normMatric,

    init: function () {
      if (initPromise) return initPromise;
      var base = 'https://www.gstatic.com/firebasejs/' + FIREBASE_VERSION + '/';
      initPromise = Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js')])
        .then(function (mods) {
          fs = mods[1];
          var app = mods[0].initializeApp(CFG.firebase);
          db = fs.getFirestore(app);
          // Only used for local testing with the Firebase emulator, e.g. emulator: "127.0.0.1:8080"
          if (CFG.emulator) {
            var hp = String(CFG.emulator).split(':');

      return initPromise;
    },

    getStudent: function (matric) { return FirebaseStore.getStudentBySid(sidOf(matric)); },
    getStudentBySid: function (sid) {
      return withTimeout(fs.getDoc(fs.doc(db, 'students', sid)))
        .then(function (snap) { return snap.exists() ? toStudent(snap.id, snap.data()) : null; })
        .catch(function (e) { throw mapFbError(e); });
    },

    createStudent: function (o) {
      var sid = sidOf(o.matric);
      var ref = fs.doc(db, 'students', sid);
      return withTimeout(fs.getDoc(ref)).then(function (snap) {
        if (snap.exists()) throw err('exists');
        var now = fs.serverTimestamp();
        var batch = fs.writeBatch(db);
        batch.set(ref, {
          name: o.name, matric: normMatric(o.matric), hasPin: !!o.pin,
          attempts: 0, bestPct: 0, bestScore: 0, bestTotal: 0, lastPct: 0, lastExamId: '',

        return {
          sid: sid, name: o.name, matric: normMatric(o.matric), hasPin: !!o.pin, attempts: 0, bestPct: 0,

        };
      }).catch(function (e) {
        // If someone created the same matric at the same moment, the rules reject our write.
        if (e && e.code === 'permission-denied') throw err('exists');
        throw mapFbError(e);
      });
    },

    checkPin: function (sid, pin) {
      return withTimeout(fs.getDoc(fs.doc(db, 'students', sid, 'pin', pinHash(sid, pin))))
        .then(function (snap) { return snap.exists(); })
        .catch(function (e) { throw mapFbError(e); });
    },

    getSeen: function (sid) {
      var local = LS.get(localSeenKey(sid), {});
      return withTimeout(fs.getDoc(fs.doc(db, 'seen', sid)), 12000)
        .then(function (snap) { return E.mergeSeen(snap.exists() ? (snap.data().courses || {}) : {}, local); })
        .catch(function () { return local; }); // offline: fall back to this phone's copy
    },

    saveSeen: function (sid, courses) {
      LS.set(localSeenKey(sid), courses);
      // Not awaited by the exam: the SDK keeps retrying while the page is open.
      return fs.setDoc(fs.doc(db, 'seen', sid), { courses: courses, updatedAt: fs.serverTimestamp() })
        .catch(function (e) { console.warn('Could not save seen questions', e); });
    },

    submitAttempt: function (sid, r) {
      var ref = fs.doc(db, 'students', sid);
      var out = null;
      return withTimeout(fs.runTransaction(db, function (tx) {
        return tx.get(ref).then(function (snap) {
          if (!snap.exists()) throw err('not-found');
          var s = toStudent(snap.id, snap.data());
          if (s.lastExamId === r.examId) {
            out = { student: s, improved: false, previousBest: s.bestPct, alreadySaved: true };
            return;
          }
          var n = s.attempts + 1;
          var improved = r.pct > s.bestPct;
          var upd = { attempts: n, lastPct: r.pct, lastExamId: r.examId, updatedAt: fs.serverTimestamp() };
          if (improved) {
            upd.bestPct = r.pct; upd.bestScore = r.score; upd.bestTotal = r.total; upd.bestAt = fs.serverTimestamp();
          }
          tx.update(ref, upd);
          tx.set(fs.doc(db, 'attempts', sid + '_' + n), {
            sid: sid, name: s.name, matric: s.matric, score: r.score, total: r.total, pct: r.pct,
            perCourse: r.perCourse, timeUsedSec: r.timeUsedSec, examId: r.examId, createdAt: fs.serverTimestamp()
          });
          var ns = Object.assign({}, s, { attempts: n, lastPct: r.pct, lastExamId: r.examId });
          if (improved) Object.assign(ns, { bestPct: r.pct, bestScore: r.score, bestTotal: r.total, bestAt: Date.now() });
          out = { student: ns, improved: improved, previousBest: s.bestPct };
        });
      }), 30000).then(function () { return out; }).catch(function (e) { throw mapFbError(e); });
    },

    subscribeLeaderboard: function (cb, onError) {
      var q = fs.query(fs.collection(db, 'students'), fs.orderBy('bestPct', 'desc'), fs.limit(CFG.leaderboardSize || 100));
      return fs.onSnapshot(q, function (snap) {
        var list = [];
        snap.forEach(function (d) { list.push(toStudent(d.id, d.data())); });
        cb(sortBoard(list));
      }, function (e) { if (onError) onError(mapFbError(e)); });
    },

    // Two count queries: cheap (about 1 read per 1000 students each).
    getRank: function (student) {
      var col = fs.collection(db, 'students');
      var totalQ = fs.getCountFromServer(fs.query(col, fs.where('attempts', '>', 0)));
      if (!student || !student.attempts) {
        return withTimeout(totalQ).then(function (t) { return { rank: null, total: t.data().count }; }).catch(function (e) { throw mapFbError(e); });
      }
      var aheadQ = fs.getCountFromServer(fs.query(col, fs.where('bestPct', '>', student.bestPct)));
      return withTimeout(Promise.all([aheadQ, totalQ])).then(function (r) {
        return { rank: r[0].data().count + 1, total: r[1].data().count };
      }).catch(function (e) { throw mapFbError(e); });
    }
  };

  var useFirebase = !!(CFG.firebase && String(CFG.firebase.apiKey || '').trim() && String(CFG.firebase.projectId || '').trim());
  var store = useFirebase ? FirebaseStore : DemoStore;
  store.LS = LS;
  store.pinHash = pinHash;
  window.CBTStore = store;
})();

  <script>/* js/app.js */
/*

      topics: Array.from(new Set(b.questions.map(function (q) { return q.topic; }))) });

  });
  var PER_COURSE = Math.max(1, parseInt(CFG.questionsPerCourse, 10) || 45);
  var EXAM_MIN = parseFloat(CFG.examMinutes) > 0 ? parseFloat(CFG.examMinutes) : 120;
  function perCourseFor(code) { return Math.min(PER_COURSE, (BANKS[code] || []).length); }
  var TOTAL_Q = COURSES.reduce(function (n, c) { return n + perCourseFor(c.code); }, 0);
  var LETTERS = ['A', 'B', 'C', 'D'];

  /* ---------- state ---------- */
  var state = {
    view: 'loading',
    student: null,
    authTab: 'login',

    submitting: false,
    lb: null,

  function esc(s) {

  function pct(p) { p = Number(p) || 0; return (Math.round(p * 10) / 10) + '%'; }
  function initials(name) {
    var parts = String(name || '?').trim().split(/\s+/);

  function clock(ms) {

      }, function () { return cached; }).then(function (st) {
        if (!st) { LS.del(SESSION_KEY); return showAuth(); }
        setStudent(st);
        return afterLogin();
      });
    }).catch(function (e) {
      console.error(e);
      $app.innerHTML = '<div class="min-h-screen flex items-center justify-center p-6"><div class="card p-6 max-w-sm text-center">' +
        '<h1 class="text-lg font-extrabold text-blue-900">Could not connect</h1>' +
        '<p class="mt-2 text-sm text-slate-600">' + esc(friendlyError(e)) + '</p>' +
        '<button type="button" class="btn btn-primary mt-5 w-full" data-action="reload">Try again</button></div></div>';
    });
  }

  function setStudent(st) {
    state.student = st;
    LS.set('cbt_student_' + st.sid, st);
    LS.set(SESSION_KEY, { sid: st.sid });
  }

  function afterLogin() {
    return retryPending().then(function () {
      var ex = LS.get(k('exam'), null);
      if (ex && ex.sid === state.student.sid && ex.sections) {
        state.exam = ex;
        if (Date.now() >= ex.endsAt) return submitExam(true);
        return showExam();
      }
      showDashboard();
    });
  }

  /* A result that could not be sent (offline) is retried here. */
  function retryPending() {
    if (!state.student) return Promise.resolve();
    var p = LS.get(k('pending'), null);
    if (!p) return Promise.resolve();
    return Store.submitAttempt(state.student.sid, p).then(function (r) {
      LS.del(k('pending'));
      setStudent(r.student);
      var last = LS.get(k('result'), null);
      if (last && last.examId === p.examId) { last.synced = true; last.improved = r.improved; LS.set(k('result'), last); }
      toast('Your last score has been added to the leaderboard.', 'success');
    }, function (e) { console.warn('Pending result not sent yet', e); });
  }

  /* =====================================================================
   *  AUTH SCREEN
   * ===================================================================== */

    state.authTab = tab || state.authTab || 'login';
    document.title = (CFG.siteName || 'CBT Practice') + ': Log in';
    var login = state.authTab === 'login';

    };
    var field = function (id, label, attrs, hint) {
      return '<label class="block"><span class="text-sm font-semibold text-slate-700">' + label + '</span>' +
        '<input id="' + id + '" class="input mt-1.5" ' + attrs + '>' +
        (hint ? '<span class="block mt-1 text-xs text-slate-400">' + hint + '</span>' : '') + '</label>';
    };
    var fields = login
      ? field('f-matric', 'Matric number', 'autocomplete="username" autocapitalize="characters" placeholder="e.g. UG/24/0123"') +
        (pinOn ? field('f-pin', '4 digit PIN', 'type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="****"') : '')
      : field('f-name', 'Full name', 'autocomplete="name" autocapitalize="words" placeholder="e.g. Amina Bello"', 'First name and last name') +
        field('f-matric', 'Matric number', 'autocomplete="username" autocapitalize="characters" placeholder="e.g. UG/24/0123"', 'This cannot be changed later, so type it carefully.') +
        (pinOn ? field('f-pin', 'Choose a 4 digit PIN', 'type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="****"', 'You will need this PIN to log in.') +
          field('f-pin2', 'Type the PIN again', 'type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="****"') : '');

    $app.innerHTML =
      demoBanner() +
      '<div class="min-h-screen flex flex-col">' +
      '<div class="hero text-white text-center px-6 pt-12 pb-28">' +
      '<div class="mx-auto w-14 h-14 rounded-2xl bg-white/15 flex items-center justify-center ring-1 ring-white/30">' + ICON.logo + '</div>' +
      '<h1 class="mt-4 text-2xl sm:text-3xl font-extrabold tracking-tight">' + esc(CFG.siteName || 'CBT Practice') + '</h1>' +
      '<p class="mt-1 text-blue-100 font-semibold">' + esc(CFG.className || '') + '</p>' +
      '<p class="mt-3 text-sm text-blue-100/90 max-w-sm mx-auto">Practise JAMB style tests and see where you stand on one live class leaderboard.</p>' +
      '</div>' +
      '<div class="px-4 -mt-20 flex-1">' +
      '<div class="card max-w-md mx-auto p-5 sm:p-7 fade-in">' +
      '<div class="flex gap-1 p-1 bg-blue-50 rounded-2xl" role="tablist">' + tabBtn('login', 'Log in') + tabBtn('signup', 'Sign up') + '</div>' +
      '<div class="mt-6 space-y-4">' + fields + '</div>' +
      '<div id="auth-error" class="hidden mt-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm font-semibold px-4 py-3" role="alert"></div>' +
      '<button type="button" id="auth-submit" class="btn btn-primary w-full mt-6 text-base" data-action="' + (login ? 'login' : 'signup') + '">' +
      (login ? 'Log in' : 'Create account') + '</button>' +
      '<p class="mt-4 text-center text-sm text-slate-500">' +
      (login ? 'New here? <button type="button" class="link" data-action="auth-tab" data-tab="signup">Create an account</button>'
        : 'Already registered? <button type="button" class="link" data-action="auth-tab" data-tab="login">Log in</button>') +
      '</p></div></div>' + footer() + '</div>';
    var first = document.getElementById(login ? 'f-matric' : 'f-name');
    if (first && window.innerWidth > 640) first.focus();
  }

  function authError(msg) {
    var el = document.getElementById('auth-error');
    if (!el) return;
    if (!msg) { el.classList.add('hidden'); el.innerHTML = ''; return; }
    el.innerHTML = msg;
    el.classList.remove('hidden');
  }
  function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }

  function validMatric(m) {
    if (!m) return 'Please enter your matric number.';
    if (m.length < 4 || m.length > 25) return 'Please enter a valid matric number.';
    if (!/^[A-Z0-9/\-.]+$/.test(m)) return 'A matric number can only contain letters, numbers and the symbols / - .';
    return '';
  }

  function doLogin(btn) {
    authError('');
    var matric = Store.normMatric(val('f-matric'));
    var pin = val('f-pin').trim();
    var bad = validMatric(matric);
    if (bad) return authError(esc(bad));
    if (CFG.requirePin && !/^\d{4}$/.test(pin)) return authError('Please enter your 4 digit PIN.');
    setBusy(btn, true, 'Logging in...');
    Store.getStudent(matric).then(function (st) {
      if (!st) {
        setBusy(btn, false);
        return authError('No account found for this matric number. Tap <b>Sign up</b> above to create one.');
      }
      var check = (CFG.requirePin && st.hasPin) ? Store.checkPin(st.sid, pin) : Promise.resolve(true);
      return check.then(function (ok) {
        if (!ok) { setBusy(btn, false); return authError('That PIN is not correct. Please try again.'); }
        setStudent(st);
        toast('Welcome back, ' + firstName(st.name) + '!', 'success');
        return afterLogin();
      });
    }).catch(function (e) { setBusy(btn, false); authError(esc(friendlyError(e))); });
  }

  function doSignup(btn) {
    authError('');
    var name = val('f-name').replace(/\s+/g, ' ').trim();
    var matric = Store.normMatric(val('f-matric'));
    var pin = val('f-pin').trim(), pin2 = val('f-pin2').trim();
    var parts = name.split(' ').filter(function (p) { return p.replace(/[^A-Za-z]/g, '').length >= 2; });
    if (!name) return authError('Please enter your full name.');
    if (!/^[A-Za-z][A-Za-z .'\-]*$/.test(name)) return authError('Your name can only contain letters, spaces, hyphens and apostrophes.');
    if (parts.length < 2) return authError('Please enter your full name: first name and last name (for example, Amina Bello).');
    if (name.length > 60) return authError('That name is too long. Please use your first and last name.');
    var bad = validMatric(matric);
    if (bad) return authError(esc(bad));
    if (CFG.requirePin) {
      if (!/^\d{4}$/.test(pin)) return authError('Your PIN must be exactly 4 digits.');
      if (pin !== pin2) return authError('The two PINs do not match. Please type them again.');
    }
    setBusy(btn, true, 'Creating account...');
    Store.createStudent({ name: titleCase(name), matric: matric, pin: CFG.requirePin ? pin : '' }).then(function (st) {
      setStudent(st);
      toast('Account created. Welcome, ' + firstName(st.name) + '!', 'success');
      return afterLogin();
    }).catch(function (e) {
      setBusy(btn, false);
      if (e && e.code === 'exists') return authError('This matric number already has an account. Tap <b>Log in</b> above to continue.');
      authError(esc(friendlyError(e)));
    });
  }

  function logout() {
    var hasExam = !!LS.get(k('exam'), null);
    openModal({
      title: 'Log out?',
      body: hasExam ? 'You have an exam in progress. Its timer keeps running while you are logged out.' : 'You can log in again any time with your matric number.',
      actions: [
        { label: 'Cancel' },
        { label: 'Log out', danger: true, onClick: function () {
          closeModal();
          stopTimer();
          stopLeaderboard();
          LS.del(SESSION_KEY);
          state.student = null; state.exam = null; state.result = null; state.rankInfo = null; state.seen = null; state.lb = null;
          showAuth('login');
        } }
      ]
    });
  }
